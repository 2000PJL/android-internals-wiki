<title id="title">用身份和每条事件时序解释积压</title>
<desc id="desc">用身份和每条事件时序解释积压：dumpsys与普通trace未必暴露全部字段；缺失项需受控日志或额外采集，不依赖不存在的固定Perfetto track名。 dumpsys与普通trace未必暴露全部字段；缺失项需受控日志或额外采集，不依赖不存在的固定Perfetto track名。 </desc>
