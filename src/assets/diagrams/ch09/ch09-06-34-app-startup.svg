<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc">
<title id="title">App Startup 合并组件仍有同步初始化</title>
<desc id="desc">App Startup 合并组件仍有同步初始化：applicationContext为空时有延后分支；依赖循环会被库检测，但耗时初始化或同步I/O仍可阻塞当前发布路径。 applicationContext为空时有延后分支；依赖循环会被库检测，但耗时初始化或同步I/O仍可阻塞当前发布路径。 前后依赖阶段1到2；前后依赖阶段2到3；前后依赖阶段3到4</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
