<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Activity 启动时的进程选择</title>
<desc id="desc">Activity 启动时的进程选择：已注册应用线程可复用；否则异步请求创建进程。 已注册应用线程可复用；否则异步请求创建进程。 进入左侧条件分支；进入右侧条件分支；左侧结果汇入后续分析；右侧结果汇入后续分析</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
