<path d="M 829 70 Q 990.0 70.3 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 315.6 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
