<path d="M 104 40 Q 600.0 39.3 1096 40 Q 1100 40 1100 44 L 1100 156 Q 1100 160 1096 160 Q 600.0 160.5 104 160 Q 100 160 100 156 L 100 44 Q 100 40 104 40" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Launcher → ATMS：启动请求</tspan>
<tspan x="600.0" dy="34.0">App → AMS：attachApplication</tspan>
</text>
<path d="M 104 220 Q 600.0 220.1 1096 220 Q 1100 220 1100 224 L 1100 336 Q 1100 340 1096 340 Q 600.0 340.1 104 340 Q 100 340 100 336 L 100 224 Q 100 220 104 220" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="271.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AMS → App：oneway bindApplication</tspan>
<tspan x="600.0" dy="34.0">生命周期事务驱动 App 主线程执行</tspan>
</text>
<path d="M 104 400 Q 600.0 399.6 1096 400 Q 1100 400 1100 404 L 1100 516 Q 1100 520 1096 520 Q 600.0 519.9 104 520 Q 100 520 100 516 L 100 404 Q 100 400 104 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="451.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">App → WMS：窗口注册 / relayout 等</tspan>
<tspan x="600.0" dy="34.0">finishDrawing 属于 oneway 上报</tspan>
</text>
<path d="M 104 580 Q 600.0 580.2 1096 580 Q 1100 580 1100 584 L 1100 696 Q 1100 700 1096 700 Q 600.0 700.6 104 700 Q 100 700 100 696 L 100 584 Q 100 580 104 580" fill="white" stroke="#4CAF50" stroke-width="3"/>
