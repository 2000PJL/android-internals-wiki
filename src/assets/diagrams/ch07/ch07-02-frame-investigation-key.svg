<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">单帧证据的身份与显示关联</title>
<desc id="desc">保留多layer同token时的身份，避免等值误联结。 字段身份与分析关系，不把token当成跨layer唯一键；工具未覆盖路径需改查buffer/layer/fence。 按配对关系读预期窗口；按字段而不是颜色判断结果；预期窗口与显示证据结合；异常分类与显示证据结合</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
