<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">重绘与布局请求进入遍历</title>
<desc id="desc">避免把invalidate与requestLayout成本视为相同。 机制概览；允许多次布局/特殊遍历分支，不声称所有请求永远只执行一次。 重绘请求进入遍历调度；布局请求进入遍历调度；按本帧需求实际执行</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="870" fill="white"/>
<path d="M 315 170 L 315 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 330 L 315 340 L 321 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 170 L 885 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 330 L 885 340 L 891 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 470 L 600 650" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 640 L 600 650 L 606 640" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 45 Q 315.0 44.5 556 45 Q 560 45 560 49 L 560 166 Q 560 170 556 170 Q 315.0 169.7 74 170 Q 70 170 70 166 L 70 49 Q 70 45 74 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">invalidate()</tspan>
<tspan x="315.0" dy="34.0">请求重绘 / 脏区域更新</tspan>
</text>
<path d="M 644 45 Q 885.0 45.5 1126 45 Q 1130 45 1130 49 L 1130 166 Q 1130 170 1126 170 Q 885.0 170.3 644 170 Q 640 170 640 166 L 640 49 Q 640 45 644 45" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="885.0" y="99.0" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">requestLayout()</tspan>
<tspan x="885.0" dy="34.0">请求重新确定尺寸与位置</tspan>
</text>
<path d="M 154 340 Q 600.0 340.1 1046 340 Q 1050 340 1050 344 L 1050 466 Q 1050 470 1046 470 Q 600.0 469.7 154 470 Q 150 470 150 466 L 150 344 Q 150 340 154 340" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ViewRootImpl 安排 traversal</tspan>
<tspan x="600.0" dy="34.0">可能合并多个请求</tspan>
</text>
<path d="M 154 650 Q 600.0 649.3 1046 650 Q 1050 650 1050 654 L 1050 786 Q 1050 790 1046 790 Q 600.0 789.4 154 790 Q 150 790 150 786 L 150 654 Q 150 650 154 650" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="711.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">按需 measure / layout 与绘制记录</tspan>
<tspan x="600.0" dy="34.0">检查实际次数、节点与自定义代码</tspan>
</text>
</svg>
