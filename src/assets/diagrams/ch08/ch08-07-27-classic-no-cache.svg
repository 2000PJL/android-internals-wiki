<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">频繁使用应切换调用模式而非复用旧 token</title>
<desc id="desc">频繁使用应切换调用模式而非复用旧 token：两种模式都不能跨动作复用旧业务 token；Standard 的平台内部缓存与应用缓存判定是不同层次。 两种模式都不能跨动作复用旧业务 token；Standard 的平台内部缓存与应用缓存判定是不同层次。 </desc>
