<title id="title">已结束查询保留什么</title>
<desc id="desc">已结束查询保留什么：该排名查询排除了未结束项；没有出现在结果里不能证明没有卡顿，需结合9.2的窗口裁剪方法。 该排名查询排除了未结束项；没有出现在结果里不能证明没有卡顿，需结合9.2的窗口裁剪方法。 左分支；右分支</desc>
