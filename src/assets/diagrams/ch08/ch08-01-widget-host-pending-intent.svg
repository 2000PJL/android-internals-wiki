<path d="M 425 179 L 435 185 L 425 191" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 765 185 L 825 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 815 179 L 825 185 L 815 191" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 49 90 Q 210.0 90.1 371 90 Q 375 90 375 94 L 375 276 Q 375 280 371 280 Q 210.0 279.9 49 280 Q 45 280 45 276 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
