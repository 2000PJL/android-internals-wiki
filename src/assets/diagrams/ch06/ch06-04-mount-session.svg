<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc">
<title id="title">FUSE 会话的 fd 交接链路</title>
<desc id="desc">明确vold与framework如何把会话交给MediaProvider。 仅展示成功建立会话的主链；不画成每次I/O重建会话。 按所示依赖进入下一阶段；按所示依赖进入下一阶段；按所示依赖进入下一阶段；按所示依赖进入下一阶段；按所示依赖进入下一阶段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1150" fill="white"/>
<path d="M 600 165 L 600 230" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 220 L 600 230 L 606 220" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 350 L 600 415" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 405 L 600 415 L 606 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 535 L 600 600" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 590 L 600 600 L 606 590" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 720 L 600 785" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 775 L 600 785 L 606 775" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 905 L 600 970" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 960 L 600 970 L 606 960" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.7 1046 45 Q 1050 45 1050 49 L 1050 161 Q 1050 165 1046 165 Q 600.0 165.4 154 165 Q 150 165 150 161 L 150 49 Q 150 45 154 45" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">vold：EmulatedVolume.doMount()</tspan>
<tspan x="600.0" dy="34.0">MountUserFuse() 取得 /dev/fuse fd</tspan>
</text>
<path d="M 154 230 Q 600.0 230.7 1046 230 Q 1050 230 1050 234 L 1050 346 Q 1050 350 1046 350 Q 600.0 349.4 154 350 Q 150 350 150 346 L 150 234 Q 150 230 154 230" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="281.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">IVoldMountCallback.onVolumeChecking()</tspan>
<tspan x="600.0" dy="34.0">system_server 接收 fd 与路径</tspan>
</text>
<path d="M 154 415 Q 600.0 415.8 1046 415 Q 1050 415 1050 419 L 1050 531 Q 1050 535 1046 535 Q 600.0 535.7 154 535 Q 150 535 150 531 L 150 419 Q 150 415 154 415" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="466.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">StorageSessionController.onVolumeMount()</tspan>
<tspan x="600.0" dy="34.0">按卷与用户选择 StorageUserConnection</tspan>
</text>
<path d="M 154 600 Q 600.0 600.7 1046 600 Q 1050 600 1050 604 L 1050 716 Q 1050 720 1046 720 Q 600.0 720.1 154 720 Q 150 720 150 716 L 150 604 Q 150 600 154 600" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="651.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">StorageUserConnection.startSession()</tspan>
<tspan x="600.0" dy="34.0">调用 ExternalStorageService</tspan>
</text>
<path d="M 154 785 Q 600.0 785.1 1046 785 Q 1050 785 1050 789 L 1050 901 Q 1050 905 1046 905 Q 600.0 905.8 154 905 Q 150 905 150 901 L 150 789 Q 150 785 154 785" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="836.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ExternalStorageServiceImpl.onStartSession()</tspan>
<tspan x="600.0" dy="34.0">创建并启动 FuseDaemon</tspan>
</text>
<path d="M 154 970 Q 600.0 970.6 1046 970 Q 1050 970 1050 974 L 1050 1086 Q 1050 1090 1046 1090 Q 600.0 1089.4 154 1090 Q 150 1090 150 1086 L 150 974 Q 150 970 154 970" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="1021.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">FuseDaemon.run() → native_start()</tspan>
<tspan x="600.0" dy="34.0">该会话持续服务内核 FUSE 请求</tspan>
</text>
</svg>
