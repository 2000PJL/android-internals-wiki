<text x="600.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SF CPU / HWC deadline 分支</tspan>
<tspan x="600.0" dy="34.0">检查 SF 主线程、validate/present、锁与调度</tspan>
</text>
<path d="M 154 295 Q 600.0 294.3 1046 295 Q 1050 295 1050 299 L 1050 451 Q 1050 455 1046 455 Q 600.0 455.2 154 455 Q 150 455 150 451 L 150 299 Q 150 295 154 295" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="366.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SF GPU composition deadline 分支</tspan>
<tspan x="600.0" dy="34.0">检查 RenderEngine、client target fence 与 GPU 队列</tspan>
</text>
<path d="M 154 545 Q 600.0 545.6 1046 545 Q 1050 545 1050 549 L 1050 701 Q 1050 705 1046 705 Q 600.0 705.7 154 705 Q 150 705 150 701 L 150 549 Q 150 545 154 545" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="616.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">DisplayHAL / 显示末端分支</tspan>
<tspan x="600.0" dy="34.0">检查 Composer、present fence、驱动与模式切换</tspan>
</text>
