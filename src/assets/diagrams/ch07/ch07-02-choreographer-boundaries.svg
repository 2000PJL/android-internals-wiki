<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Choreographer 回调顺序</tspan>
<tspan x="600.0" dy="34.0">Input → Animation → Insets → Traversal → Commit</tspan>
</text>
<path d="M 74 375 Q 315.0 375.7 556 375 Q 560 375 560 379 L 560 506 Q 560 510 556 510 Q 315.0 510.5 74 510 Q 70 510 70 506 L 70 379 Q 70 375 74 375" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="315.0" y="434.0" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">Traversal 的 View 工作</tspan>
<tspan x="315.0" dy="34.0">measure / layout / draw</tspan>
</text>
<path d="M 644 375 Q 885.0 374.5 1126 375 Q 1130 375 1130 379 L 1130 506 Q 1130 510 1126 510 Q 885.0 510.4 644 510 Q 640 510 640 506 L 640 379 Q 640 375 644 375" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="885.0" y="434.0" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">RenderThread 的 DrawFrame</tspan>
<tspan x="885.0" dy="34.0">渲染准备 / 同步 / 提交 / 等待</tspan>
</text>
<path d="M 124 725 Q 600.0 724.3 1076 725 Q 1080 725 1080 729 L 1080 861 Q 1080 865 1076 865 Q 600.0 865.4 124 865 Q 120 865 120 861 L 120 729 Q 120 725 124 725" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="786.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">分别检查完成端点</tspan>
