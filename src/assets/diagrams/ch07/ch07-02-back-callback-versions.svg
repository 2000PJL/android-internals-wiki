<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">预测性返回的两类能力和版本</title>
<desc id="desc">分清提交回调与进度回调的平台和AndroidX入口。 AndroidX是另一种受支持入口，不表示必须与平台回调同时注册；opt-in与导航状态仍影响行为。 平台在提交接口上扩展进度能力</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1010" fill="white"/>
<path d="M 600 215 L 600 405" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 395 L 600 405 L 606 395" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.7 1046 45 Q 1050 45 1050 49 L 1050 211 Q 1050 215 1046 215 Q 600.0 215.0 154 215 Q 150 215 150 211 L 150 49 Q 150 45 154 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="104.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">只处理返回提交</tspan>
<tspan x="600.0" dy="34.0">平台 OnBackInvokedCallback：API 33+</tspan>
<tspan x="600.0" dy="34.0">AndroidX handleOnBackPressed：Activity 1.0.0+</tspan>
</text>
<path d="M 154 405 Q 600.0 405.7 1046 405 Q 1050 405 1050 409 L 1050 571 Q 1050 575 1046 575 Q 600.0 575.6 154 575 Q 150 575 150 571 L 150 409 Q 150 405 154 405" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="464.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">平台进度入口：API 34+</tspan>
<tspan x="600.0" dy="34.0">OnBackAnimationCallback</tspan>
<tspan x="600.0" dy="34.0">started / progressed / cancelled / invoked</tspan>
</text>
<path d="M 154 765 Q 600.0 764.7 1046 765 Q 1050 765 1050 769 L 1050 931 Q 1050 935 1046 935 Q 600.0 934.2 154 935 Q 150 935 150 931 L 150 769 Q 150 765 154 765" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="824.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AndroidX 入口：Activity 1.8.0+</tspan>
<tspan x="600.0" dy="34.0">OnBackPressedCallback 的进度方法</tspan>
<tspan x="600.0" dy="34.0">框架在 API 34+ 分发 started / progressed / cancelled</tspan>
</text>
<text x="600" y="675" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">AndroidX 将兼容事件交给同一个回调对象；提交仍由 handleOnBackPressed 处理</tspan>
</text>
</svg>
