<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
<title id="title">已核对的预警点与条件</title>
<desc id="desc">已核对的预警点与条件：50%是对应native计时的预定点，实际交付可能延迟；short FGS的payload timeout与consumed还需分别核对基准。 50%是对应native计时的预定点，实际交付可能延迟；short FGS的payload timeout与consumed还需分别核对基准。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="555" fill="white"/>
<path d="M 49 45 Q 310.0 45.6 571 45 Q 575 45 575 49 L 575 231 Q 575 235 571 235 Q 310.0 235.2 49 235 Q 45 235 45 231 L 45 49 Q 45 45 49 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="310.0" y="116.53999999999999" text-anchor="middle" style="font-size:23px">
<tspan x="310.0" dy="0">Input no focused window</tspan>
<tspan x="310.0" dy="31.28">max(D/2,2000ms×HW)</tspan>
<tspan x="310.0" dy="31.28">从deadline反推预定点</tspan>
</text>
<path d="M 629 45 Q 890.0 45.7 1151 45 Q 1155 45 1155 49 L 1155 231 Q 1155 235 1151 235 Q 890.0 235.1 629 235 Q 625 235 625 231 L 625 49 Q 625 45 629 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.53999999999999" text-anchor="middle" style="font-size:23px">
<tspan x="890.0" dy="0">Broadcast timer</tspan>
<tspan x="890.0" dy="31.28">native split point 50%</tspan>
<tspan x="890.0" dy="31.28">有效active队列才继续</tspan>
</text>
<path d="M 49 300 Q 310.0 299.8 571 300 Q 575 300 575 304 L 575 486 Q 575 490 571 490 Q 310.0 490.1 49 490 Q 45 490 45 486 L 45 304 Q 45 300 49 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="310.0" y="371.54" text-anchor="middle" style="font-size:23px">
<tspan x="310.0" dy="0">Service execution / start-FGS</tspan>
<tspan x="310.0" dy="31.28">native split point 50%</tspan>
<tspan x="310.0" dy="31.28">Handler再核对相应对象</tspan>
</text>
<path d="M 629 300 Q 890.0 300.1 1151 300 Q 1155 300 1155 304 L 1155 486 Q 1155 490 1151 490 Q 890.0 490.5 629 490 Q 625 490 625 486 L 625 304 Q 625 300 629 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="890.0" y="371.54" text-anchor="middle" style="font-size:23px">
<tspan x="890.0" dy="0">short FGS</tspan>
<tspan x="890.0" dy="31.28">onTimeout后剩余宽限的50%</tspan>
<tspan x="890.0" dy="31.28">不是从最初服务开始算</tspan>
</text>
</svg>
