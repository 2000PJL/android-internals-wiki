<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc">
<title id="title">FrameTracer 与 FrameTimeline 使用不同身份体系</title>
<desc id="desc">避免frame_number等于surface_frame_token的错误表连接。 并列比较，不声称所有proto枚举都有生产发射点或固定duration；底部不是某个API自动执行的join。 FrameTracer记录buffer阶段证据。；FrameTimeline记录调度与结果分类。</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1190" fill="white"/>
<path d="M 305 180 L 305 450" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 299 440 L 305 450 L 311 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 895 180 L 895 450" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 889 440 L 895 450 L 901 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 70 Q 305.0 70.1 546 70 Q 550 70 550 74 L 550 176 Q 550 180 546 180 Q 305.0 180.3 64 180 Q 60 180 60 176 L 60 74 Q 60 70 64 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">FrameTracer</tspan>
<tspan x="305.0" dy="34.0">android.surfaceflinger.frame</tspan>
</text>
<path d="M 654 70 Q 895.0 69.9 1136 70 Q 1140 70 1140 74 L 1140 176 Q 1140 180 1136 180 Q 895.0 180.6 654 180 Q 650 180 650 176 L 650 74 Q 650 70 654 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="895.0" y="116.84" text-anchor="middle" style="font-size:24px">
<tspan x="895.0" dy="0">FrameTimeline</tspan>
<tspan x="895.0" dy="32.64">android.surfaceflinger.frametimeline</tspan>
</text>
<path d="M 64 450 Q 305.0 450.0 546 450 Q 550 450 550 454 L 550 591 Q 550 595 546 595 Q 305.0 595.7 64 595 Q 60 595 60 591 L 60 454 Q 60 450 64 450" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="499.04" text-anchor="middle" style="font-size:23px">
<tspan x="305.0" dy="0">buffer ID / frame number / Layer</tspan>
<tspan x="305.0" dy="31.28">dequeue / queue / fence / latch / present</tspan>
<tspan x="305.0" dy="31.28">SQL：frame_slice</tspan>
</text>
<path d="M 654 450 Q 895.0 449.5 1136 450 Q 1140 450 1140 454 L 1140 591 Q 1140 595 1136 595 Q 895.0 595.3 654 595 Q 650 595 650 591 L 650 454 Q 650 450 654 450" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="895.0" y="499.04" text-anchor="middle" style="font-size:23px">
<tspan x="895.0" dy="0">surface / display token / 进程 / Layer</tspan>
<tspan x="895.0" dy="31.28">Expected / Actual / present / jank</tspan>
<tspan x="895.0" dy="31.28">SQL：frame timeline 两类 slice 表</tspan>
</text>
<path d="M 184 970 Q 600.0 969.4 1016 970 Q 1020 970 1020 974 L 1020 1076 Q 1020 1080 1016 1080 Q 600.0 1080.2 184 1080 Q 180 1080 180 1076 L 180 974 Q 180 970 184 970" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="1016.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">共同上下文：同 Layer、同 Producer、相邻时间窗</tspan>
<tspan x="600.0" dy="34.0">结合 buffer transaction 和显示帧关联补齐证据</tspan>
</text>
<text x="600" y="800" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">frame_number ≠ surface_frame_token；数据源名称也不是 SQL 表名</tspan>
</text>
</svg>
