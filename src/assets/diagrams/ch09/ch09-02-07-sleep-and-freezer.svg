<title id="title">S、D 与 freezer 不能只凭字母互推</title>
<desc id="desc">S、D 与 freezer 不能只凭字母互推：分类依据为固定6.18源码；设备冻结仍须目标 PID、控制状态与时间证据闭合。 分类依据为固定6.18源码；设备冻结仍须目标 PID、控制状态与时间证据闭合。 </desc>
