<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">挂起、dispatch 与 sched_switch 不一一对应</title>
<desc id="desc">挂起、dispatch 与 sched_switch 不一一对应：协程状态、用户态派发和 CPU 线程切换是不同层；可各自发生多次或走直接路径。 协程状态、用户态派发和 CPU 线程切换是不同层；可各自发生多次或走直接路径。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 99.8 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 309.4 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">挂起 / 恢复</tspan>
<tspan x="210.0" dy="34.0">状态机和 continuation</tspan>
<tspan x="210.0" dy="34.0">不保证更换 Dispatcher</tspan>
</text>
<path d="M 439 100 Q 600.0 100.3 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.4 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">dispatch / 直接恢复</tspan>
<tspan x="600.0" dy="34.0">上下文与目标队列</tspan>
<tspan x="600.0" dy="34.0">不保证更换物理线程</tspan>
</text>
<path d="M 829 100 Q 990.0 99.4 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 310.7 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">sched_switch</tspan>
<tspan x="990.0" dy="34.0">CPU 上运行的线程变化</tspan>
<tspan x="990.0" dy="34.0">也来自 GC / Binder / 抢占</tspan>
</text>
</svg>
