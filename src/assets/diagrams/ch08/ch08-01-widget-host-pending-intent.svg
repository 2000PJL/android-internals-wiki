<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Widget 宿主与 PendingIntent 启动链</title>
<desc id="desc">Widget 宿主与 PendingIntent 启动链：Widget 界面在宿主进程。多实例应有不同动作身份，直接 Activity PendingIntent 可使用支持的启动转场。 extras不独立参与Intent等价身份；其他影响身份的字段仍按API合同。 前一阶段为下一阶段提供输入；前一阶段为下一阶段提供输入</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
