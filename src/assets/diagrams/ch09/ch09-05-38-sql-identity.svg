<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">从 slice 追到线程与进程身份</title>
<desc id="desc">从 slice 追到线程与进程身份：同名section可能来自不同进程或线程；查询只是耗时排序入口，不能仅凭名称做跨进程关联。 同名section可能来自不同进程或线程；查询只是耗时排序入口，不能仅凭名称做跨进程关联。 阶段1到2；阶段2到3</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="480" fill="white"/>
<path d="M 600 145 L 600 200" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 200 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 355" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 345 L 600 355 L 606 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 45 Q 600.0 44.6 1096 45 Q 1100 45 1100 49 L 1100 141 Q 1100 145 1096 145 Q 600.0 144.7 104 145 Q 100 145 100 141 L 100 49 Q 100 45 104 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">slice.track_id → thread_track.id</tspan>
</text>
<path d="M 104 200 Q 600.0 200.5 1096 200 Q 1100 200 1100 204 L 1100 296 Q 1100 300 1096 300 Q 600.0 300.7 104 300 Q 100 300 100 296 L 100 204 Q 100 200 104 200" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="241.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">thread_track.utid → thread.utid</tspan>
<tspan x="600.0" dy="34.0">thread.upid → process.upid</tspan>
</text>
<path d="M 104 355 Q 600.0 354.5 1096 355 Q 1100 355 1100 359 L 1100 451 Q 1100 455 1096 455 Q 600.0 454.7 104 455 Q 100 455 100 451 L 100 359 Q 100 355 104 355" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="396.5" text-anchor="middle" style="font-size:25px">
