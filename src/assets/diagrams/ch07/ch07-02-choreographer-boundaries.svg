</text>
<rect x="258.5" y="260.0" width="683.0" height="36.3" fill="white"/>
<text x="600" y="285" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">Commit：post-draw 回调；不是统一的 GPU / present 完成标志</tspan>
</text>
