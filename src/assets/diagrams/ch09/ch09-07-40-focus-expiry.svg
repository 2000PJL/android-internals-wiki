<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">no-focus 到期时重新检查</title>
<desc id="desc">no-focus 到期时重新检查：正式归因仍由WMS继续处理；已排出的pre command不因状态结束而自动撤回。 正式归因仍由WMS继续处理；已排出的pre command不因状态结束而自动撤回。 左侧条件分支；右侧条件分支</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="520" fill="white"/>
<path d="M 350 140 L 350 205 L 310 205 L 310 265" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 304 255 L 310 265 L 316 255" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 140 L 850 205 L 890 205 L 890 265" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 884 255 L 890 265 L 896 255" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 40 Q 600.0 39.2 1096 40 Q 1100 40 1100 44 L 1100 136 Q 1100 140 1096 140 Q 600.0 139.3 104 140 Q 100 140 100 136 L 100 44 Q 100 40 104 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="98.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">达到本次no-focus timeoutEndTime</tspan>
</text>
<path d="M 49 265 Q 310.0 265.5 571 265 Q 575 265 575 269 L 575 451 Q 575 455 571 455 Q 310.0 455.3 49 455 Q 45 455 45 451 L 45 269 Q 45 265 49 265" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="310.0" y="320.9" text-anchor="middle" style="font-size:23px">
<tspan x="310.0" dy="0">状态条件已变化</tspan>
<tspan x="310.0" dy="31.28">focused application不同</tspan>
<tspan x="310.0" dy="31.28">或focused window已经存在</tspan>
<tspan x="310.0" dy="31.28">不从此分支报告ANR</tspan>
</text>
<path d="M 629 265 Q 890.0 264.5 1151 265 Q 1155 265 1155 269 L 1155 451 Q 1155 455 1151 455 Q 890.0 455.5 629 455 Q 625 455 625 451 L 625 269 Q 625 265 629 265" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="890.0" y="320.9" text-anchor="middle" style="font-size:23px">
<tspan x="890.0" dy="0">仍是同一application token</tspan>
<tspan x="890.0" dy="31.28">focused window仍为空</tspan>
<tspan x="890.0" dy="31.28">onAnrLocked保存现场并排policy通知</tspan>
<tspan x="890.0" dy="31.28">随后清除本次等待状态</tspan>
</text>
</svg>
