<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Android 独立更新的三条兼容边界</title>
<desc id="desc">把应用兼容、系统厂商接口兼容和内核模块兼容分开。 各横行表示兼容约束，不是一次请求的必经调用链；KMI 不承诺跨代际兼容。 应用与平台通过 SDK API 契约兼容。；Framework 和 vendor 组合需满足 VINTF 等兼容条件。；同一 KMI 代际内，厂商模块使用 GKI 允许的接口。</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="770" fill="white"/>
<path d="M 450 160 L 750 160" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 740 154 L 750 160 L 740 166" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 350 L 750 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 740 344 L 750 350 L 740 356" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 540 L 750 540" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 740 534 L 750 540 L 740 546" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 94 120 Q 270.0 120.6 446 120 Q 450 120 450 124 L 450 196 Q 450 200 446 200 Q 270.0 200.8 94 200 Q 90 200 90 196 L 90 124 Q 90 120 94 120" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="270.0" y="168.5" text-anchor="middle" style="font-size:25px">
<tspan x="270.0" dy="0">应用</tspan>
</text>
<path d="M 754 120 Q 930.0 120.1 1106 120 Q 1110 120 1110 124 L 1110 196 Q 1110 200 1106 200 Q 930.0 200.4 754 200 Q 750 200 750 196 L 750 124 Q 750 120 754 120" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="930.0" y="168.5" text-anchor="middle" style="font-size:25px">
<tspan x="930.0" dy="0">Android 平台 / Framework</tspan>
</text>
<path d="M 94 310 Q 270.0 309.6 446 310 Q 450 310 450 314 L 450 386 Q 450 390 446 390 Q 270.0 389.7 94 390 Q 90 390 90 386 L 90 314 Q 90 310 94 310" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="270.0" y="358.5" text-anchor="middle" style="font-size:25px">
<tspan x="270.0" dy="0">Framework 侧</tspan>
</text>
<path d="M 754 310 Q 930.0 310.2 1106 310 Q 1110 310 1110 314 L 1110 386 Q 1110 390 1106 390 Q 930.0 390.4 754 390 Q 750 390 750 386 L 750 314 Q 750 310 754 310" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="930.0" y="358.5" text-anchor="middle" style="font-size:25px">
<tspan x="930.0" dy="0">Vendor / HAL 实现</tspan>
</text>
<path d="M 94 500 Q 270.0 500.2 446 500 Q 450 500 450 504 L 450 576 Q 450 580 446 580 Q 270.0 579.5 94 580 Q 90 580 90 576 L 90 504 Q 90 500 94 500" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="270.0" y="548.5" text-anchor="middle" style="font-size:25px">
<tspan x="270.0" dy="0">GKI 通用内核</tspan>
</text>
<path d="M 754 500 Q 930.0 500.2 1106 500 Q 1110 500 1110 504 L 1110 576 Q 1110 580 1106 580 Q 930.0 580.4 754 580 Q 750 580 750 576 L 750 504 Q 750 500 754 500" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="930.0" y="548.5" text-anchor="middle" style="font-size:25px">
<tspan x="930.0" dy="0">厂商内核模块</tspan>
</text>
<rect x="546.7" y="117.0" width="106.5" height="36.3" fill="white"/>
<text x="600" y="142" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">SDK API</tspan>
</text>
<rect x="498.2" y="305.0" width="203.6" height="36.3" fill="white"/>
<text x="600" y="330" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">VINTF / HAL 接口</tspan>
</text>
<rect x="532.9" y="495.0" width="134.2" height="36.3" fill="white"/>
<text x="600" y="520" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">同代际 KMI</tspan>
</text>
<text x="600" y="665" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">Mainline：部分模块以 APK / APEX 独立更新</tspan>
</text>
<text x="600" y="710" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">平台版本、targetSdk、模块版本、vendor 与内核需要分别记录</tspan>
</text>
