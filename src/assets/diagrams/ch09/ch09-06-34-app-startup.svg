<text x="600.0" y="551.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">完成Provider回调后才继续整批发布</tspan>
<tspan x="600.0" dy="34.0">合并组件数不自动转后台</tspan>
</text>
