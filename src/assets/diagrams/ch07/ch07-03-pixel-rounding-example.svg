<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">整数像素会怎样改变低速步幅</title>
<desc id="desc">用独立算术示例说明模型小数位移与整数输出之间的差异。 Java Math.round数值已执行核验；示意没有叠加毫秒量化、真实减速和显示误差。 相同的小数步幅进入像素取整；整数输出相减形成不同步幅</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="880" fill="white"/>
<path d="M 600 185 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 490 L 600 655" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 645 L 600 655 L 606 645" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 45.7 1046 45 Q 1050 45 1050 49 L 1050 181 Q 1050 185 1046 185 Q 600.0 185.2 154 185 Q 150 185 150 181 L 150 49 Q 150 45 154 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">分数位移的计算示例</tspan>
<tspan x="600.0" dy="34.0">0.0 → 0.4 → 0.8 → 1.2 → 1.6 px</tspan>
</text>
<path d="M 154 350 Q 600.0 350.3 1046 350 Q 1050 350 1050 354 L 1050 486 Q 1050 490 1046 490 Q 600.0 490.6 154 490 Q 150 490 150 486 L 150 354 Q 150 350 154 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">逐次 round 后的整数位移</tspan>
<tspan x="600.0" dy="34.0">0 → 0 → 1 → 1 → 2 px</tspan>
</text>
<path d="M 154 655 Q 600.0 655.5 1046 655 Q 1050 655 1050 659 L 1050 791 Q 1050 795 1046 795 Q 600.0 795.5 154 795 Q 150 795 150 791 L 150 659 Q 150 655 154 655" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="716.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">整数位移的步幅</tspan>
<tspan x="600.0" dy="34.0">0 → 1 → 0 → 1 px</tspan>
</text>
</svg>
