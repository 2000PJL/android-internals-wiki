<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">延迟、懒加载与异步改变不同属性</title>
<desc id="desc">延迟、懒加载与异步改变不同属性：开始时间、触发条件、执行方式是三个独立维度，可组合安排。 开始时间、触发条件、执行方式是三个独立维度，可组合安排。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 100.7 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 309.5 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">延迟初始化</tspan>
<tspan x="210.0" dy="34.0">改变何时开始</tspan>
<tspan x="210.0" dy="34.0">如已核实首帧边界后</tspan>
</text>
<path d="M 439 100 Q 600.0 100.4 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.2 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">懒加载</tspan>
<tspan x="600.0" dy="34.0">改变触发条件</tspan>
<tspan x="600.0" dy="34.0">如首次进入搜索功能</tspan>
</text>
<path d="M 829 100 Q 990.0 100.2 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 310.1 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">异步初始化</tspan>
<tspan x="990.0" dy="34.0">改变线程 / 等待方式</tspan>
<tspan x="990.0" dy="34.0">仍可能在启动时立即运行</tspan>
</text>
</svg>
