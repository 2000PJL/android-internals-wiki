<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">JankType 位标志的调查导航</title>
<desc id="desc">把位标志分组作为调查入口而非最终根因。 分组是导航而非互斥责任分类；NonAnimating与显示状态等不直接参与加权严重度。 应用生产侧入口；合成侧入口；显示侧入口；相邻帧和预测入口</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
