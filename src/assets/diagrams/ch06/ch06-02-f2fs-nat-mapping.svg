<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">F2FS 的 NAT、node 与数据地址</title>
<desc id="desc">解释稳定nid如何隔离node块地址变化，避免将NAT画成数据块索引。 忽略inline data、压缩与extent cache捷径；间接node存nid，只有对应数据地址数组槽位指向数据块。 根据nid查询NAT；定位对应node块；从数据地址槽位定位文件数据</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="850" fill="white"/>
<path d="M 600 150 L 600 245" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 235 L 600 245 L 606 235" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 355 L 600 450" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 440 L 600 450 L 606 440" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 565 L 600 665" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 655 L 600 665 L 606 655" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 164 40 Q 600.0 40.0 1036 40 Q 1040 40 1040 44 L 1040 146 Q 1040 150 1036 150 Q 600.0 149.6 164 150 Q 160 150 160 146 L 160 44 Q 160 40 164 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">文件偏移与 inode / node 索引路径</tspan>
<tspan x="600.0" dy="34.0">父 node 中引用子 node 的稳定 nid</tspan>
</text>
<path d="M 164 245 Q 600.0 244.8 1036 245 Q 1040 245 1040 249 L 1040 351 Q 1040 355 1036 355 Q 600.0 354.4 164 355 Q 160 355 160 351 L 160 249 Q 160 245 164 245" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="308.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">NAT：nid → 当前 node 块地址</tspan>
</text>
<path d="M 164 450 Q 600.0 449.8 1036 450 Q 1040 450 1040 454 L 1040 561 Q 1040 565 1036 565 Q 600.0 565.1 164 565 Q 160 565 160 561 L 160 454 Q 160 450 164 450" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="499.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">inode / direct node 的地址数组</tspan>
<tspan x="600.0" dy="34.0">相关槽位给出 data block address</tspan>
</text>
<path d="M 164 665 Q 600.0 665.3 1036 665 Q 1040 665 1040 669 L 1040 771 Q 1040 775 1036 775 Q 600.0 774.4 164 775 Q 160 775 160 771 L 160 669 Q 160 665 164 665" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="711.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">文件数据块</tspan>
<tspan x="600.0" dy="34.0">新写入可分配新地址，再更新 node 槽位</tspan>
</text>
</svg>
