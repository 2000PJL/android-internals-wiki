<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">WebView 与多窗口先定位实际出图对象</title>
<desc id="desc">避免套用独立GPU进程或多窗口必定CLIENT的假设。 按组件角色导航，不把WebView GPU service画成独立进程；不要求renderer在所有历史设备均为隔离进程。 宿主侧工作关联出图对象；renderer侧工作关联出图对象；多窗口场景按实际合成与负载判断</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="920" fill="white"/>
<path d="M 315 175 L 315 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 340 L 315 350 L 321 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 175 L 885 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 340 L 885 350 L 891 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 480 L 600 680" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 670 L 600 680 L 606 670" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 45 Q 315.0 45.2 556 45 Q 560 45 560 49 L 560 171 Q 560 175 556 175 Q 315.0 175.5 74 175 Q 70 175 70 171 L 70 49 Q 70 45 74 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">WebView 宿主进程</tspan>
<tspan x="315.0" dy="34.0">UI / browser / GPU service</tspan>
</text>
<path d="M 644 45 Q 885.0 44.9 1126 45 Q 1130 45 1130 49 L 1130 171 Q 1130 175 1126 175 Q 885.0 174.5 644 175 Q 640 175 640 171 L 640 49 Q 640 45 644 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="885.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">Chromium renderer 路径</tspan>
<tspan x="885.0" dy="34.0">脚本 / 布局 / 合成相关工作</tspan>
</text>
<path d="M 154 350 Q 600.0 350.2 1046 350 Q 1050 350 1050 354 L 1050 476 Q 1050 480 1046 480 Q 600.0 479.7 154 480 Q 150 480 150 476 L 150 354 Q 150 350 154 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="406.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">定位具体 producer、线程 / 进程、layer</tspan>
<tspan x="600.0" dy="34.0">关联目标 buffer 与 fence</tspan>
</text>
<path d="M 154 680 Q 600.0 680.6 1046 680 Q 1050 680 1050 684 L 1050 821 Q 1050 825 1046 825 Q 600.0 824.4 154 825 Q 150 825 150 821 L 150 684 Q 150 680 154 680" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="744.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">与其他窗口的 SurfaceFrame / DisplayFrame 对照</tspan>
<tspan x="600.0" dy="34.0">检查真实 HWC 类型与 CPU / GPU 争用</tspan>
</text>
</svg>
