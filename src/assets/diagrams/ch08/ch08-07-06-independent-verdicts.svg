<title id="title">应用识别与账号授权分别读取</title>
<desc id="desc">应用识别与账号授权分别读取：账号授权和应用识别是独立字段；业务账号登录状态也需要单独验证。 账号授权和应用识别是独立字段；业务账号登录状态也需要单独验证。 按条件进入左侧路径；按条件进入右侧路径；左侧进入共同判断；右侧进入共同判断</desc>
