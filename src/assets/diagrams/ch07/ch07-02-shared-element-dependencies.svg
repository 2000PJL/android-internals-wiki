<title id="title">共享元素转场的多项依赖</title>
<desc id="desc">避免把跨窗口共享元素简化成一次bitmap复制。 可选机制不是所有共享元素都会同时创建；本图是依赖集合，不是固定执行序列。 准备状态后核对几何；按实现检查中间对象；几何变化需要与窗口显示协调；中间对象参与显示时继续追踪</desc>
