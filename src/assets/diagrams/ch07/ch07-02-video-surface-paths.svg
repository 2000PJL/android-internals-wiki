<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">视频进入显示端的两种常见路径</title>
<desc id="desc">把独立Surface与合入HWUI窗口的责任差异画清。 常见硬件加速路径示意；不承诺SurfaceView一定拿到overlay，具体buffer组织依版本和实现而变。 SurfaceView输出路径；TextureView输出路径；直接跟踪视频layer内容；由HWUI消费SurfaceTexture；独立视频与UI共同合成；AppWindow进入显示合成</desc>
