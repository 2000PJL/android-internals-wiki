<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">flatten 的顺序、并发与取消选择</title>
<desc id="desc">flatten 的顺序、并发与取消选择：Concat 依次收集内层流，Merge 限制同时收集数量，Latest 取消旧内层；外部资源总量仍须另定预算。 Concat 依次收集内层流，Merge 限制同时收集数量，Latest 取消旧内层；外部资源总量仍须另定预算。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 99.5 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 310.7 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">flatMapConcat</tspan>
<tspan x="210.0" dy="34.0">一个内层结束再收下一个</tspan>
<tspan x="210.0" dy="34.0">保留顺序约束</tspan>
</text>
<path d="M 439 100 Q 600.0 100.7 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.1 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">flatMapMerge(n)</tspan>
<tspan x="600.0" dy="34.0">同时收集内层最多 n 条</tspan>
<tspan x="600.0" dy="34.0">结果可交错</tspan>
</text>
<path d="M 829 100 Q 990.0 99.6 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 310.3 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">flatMapLatest</tspan>
<tspan x="990.0" dy="34.0">新值取消旧内层</tspan>
<tspan x="990.0" dy="34.0">依赖协作取消</tspan>
</text>
<text x="600" y="365" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">Merge 的 transform 调用仍按顺序；并发的是它返回的内层 Flow 收集</tspan>
</text>
</svg>
