</text>
<path d="M 49 300 Q 310.0 300.1 571 300 Q 575 300 575 304 L 575 456 Q 575 460 571 460 Q 310.0 459.6 49 460 Q 45 460 45 456 L 45 304 Q 45 300 49 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="310.0" y="354.5" text-anchor="middle" style="font-size:25px">
<tspan x="310.0" dy="0">Activity stop / Service start-stop</tspan>
<tspan x="310.0" dy="34.0">调用线程waitToFinish</tspan>
<tspan x="310.0" dy="34.0">可执行待处理任务或等finisher</tspan>
</text>
