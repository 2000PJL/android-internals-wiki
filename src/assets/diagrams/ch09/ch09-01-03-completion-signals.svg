<title id="title">识别各类 detector 的完成信号</title>
<desc id="desc">识别各类 detector 的完成信号：Service 的完成经 Framework 协议回报；普通 Provider query 没有通用固定十秒 ANR timer。 Service 的完成经 Framework 协议回报；普通 Provider query 没有通用固定十秒 ANR timer。 </desc>
