<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">定位协程先区分工具证据</title>
<desc id="desc">定位协程先区分工具证据：系统 trace 看线程时序，Debugger 看 Job，采样看 CPU 栈；CoroutineName 不会自动成为 Perfetto slice。 系统 trace 看线程时序，Debugger 看 Job，采样看 CPU 栈；CoroutineName 不会自动成为 Perfetto slice。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 100.1 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 309.8 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">Perfetto / System Trace</tspan>
<tspan x="210.0" dy="34.0">Running / Runnable / 等待</tspan>
<tspan x="210.0" dy="34.0">时序不独自证明 Job 身份</tspan>
</text>
<path d="M 439 100 Q 600.0 100.0 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.4 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Coroutine Debugger</tspan>
<tspan x="600.0" dy="34.0">Job 树 / 挂起与创建栈</tspan>
<tspan x="600.0" dy="34.0">暂停会扰动真实时间</tspan>
</text>
<path d="M 829 100 Q 990.0 99.5 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 309.8 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">CPU 采样</tspan>
<tspan x="990.0" dy="34.0">哪些方法正在消耗 CPU</tspan>
<tspan x="990.0" dy="34.0">不能还原完整等待因果</tspan>
</text>
</svg>
