<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Standard 与 Classic 按动作成本选择</title>
<desc id="desc">Standard 与 Classic 按动作成本选择：官方建议多数应用选 Standard；Classic 的新鲜计算成本较高，两者都需要业务绑定和验证。 官方建议多数应用选 Standard；Classic 的新鲜计算成本较高，两者都需要业务绑定和验证。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="410" fill="white"/>
<path d="M 49 90 Q 210.0 90.6 371 90 Q 375 90 375 94 L 375 316 Q 375 320 371 320 Q 210.0 320.7 49 320 Q 45 320 45 316 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="169.3" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">Standard</tspan>
<tspan x="210.0" dy="28.560000000000002">先 prepare provider</tspan>
<tspan x="210.0" dy="28.560000000000002">每次动作申请新 token</tspan>
<tspan x="210.0" dy="28.560000000000002">适合频繁按需保护</tspan>
</text>
<path d="M 439 90 Q 600.0 89.3 761 90 Q 765 90 765 94 L 765 316 Q 765 320 761 320 Q 600.0 320.7 439 320 Q 435 320 435 316 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="169.3" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">Classic</tspan>
<tspan x="600.0" dy="28.560000000000002">无需 prepare</tspan>
<tspan x="600.0" dy="28.560000000000002">每次重新计算判定</tspan>
<tspan x="600.0" dy="28.560000000000002">少量高价值动作</tspan>
</text>
<path d="M 829 90 Q 990.0 90.4 1151 90 Q 1155 90 1155 94 L 1155 316 Q 1155 320 1151 320 Q 990.0 320.0 829 320 Q 825 320 825 316 L 825 94 Q 825 90 829 90" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="183.57999999999998" text-anchor="middle" style="font-size:21px">
