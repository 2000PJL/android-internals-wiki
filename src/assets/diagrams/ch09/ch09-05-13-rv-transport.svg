<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">RemoteViews 跨进程传什么</title>
<desc id="desc">RemoteViews 跨进程传什么：传输的是布局描述及操作数据，不是发布端已构建的整棵View树；mActions不是Parcel字段名。 传输的是布局描述及操作数据，不是发布端已构建的整棵View树；mActions不是Parcel字段名。 阶段1到2；阶段2到3</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="480" fill="white"/>
<path d="M 600 145 L 600 200" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 200 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 355" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 345 L 600 355 L 606 345" stroke="#202020" stroke-width="2.8" fill="none"/>
