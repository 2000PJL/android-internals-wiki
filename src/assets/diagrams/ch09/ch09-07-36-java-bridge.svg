<title id="title">WMS 到公开 callback 的主链</title>
<desc id="desc">WMS 到公开 callback 的主链：可选trace可选择另一PID；公开warning仍使用原Activity UID，payload不含目标PID或token。 可选trace可选择另一PID；公开warning仍使用原Activity UID，payload不含目标PID或token。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
