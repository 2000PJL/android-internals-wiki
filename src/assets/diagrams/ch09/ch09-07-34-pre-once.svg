<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc">
<title id="title">同一 no-focus 状态只排一次预警</title>
<desc id="desc">同一 no-focus 状态只排一次预警：标记限制的是同一状态的入队次数，不是保证公开listener恰好收到一次，也不撤回已排队command。 标记限制的是同一状态的入队次数，不是保证公开listener恰好收到一次，也不撤回已排队command。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
