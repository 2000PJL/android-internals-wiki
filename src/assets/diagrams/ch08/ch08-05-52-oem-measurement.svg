<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">设备差异用实验室补证，线上看分布</title>
<desc id="desc">设备差异用实验室补证，线上看分布：系统调度与用户操作都在请求时长内；线上按设备组统计分位数和回退完成率，不能固定阈值宣称 sensor 异常。 系统调度与用户操作都在请求时长内；线上按设备组统计分位数和回退完成率，不能固定阈值宣称 sensor 异常。 </desc>
