<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">状态栏、Shade 与导航栏的窗口边界</title>
<desc id="desc">把三个窗口及其类型与图层关系分开 图示为独立入口；不保证所有导航模式、所有display同时存在三个可见窗口。 分别创建系统栏窗口；单独的Shade入口；单独的导航栏入口；各自对应图层而非同一ViewRoot；各自对应图层而非同一ViewRoot；各自对应图层而非同一ViewRoot</desc>
