<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1045" viewBox="0 0 1200 1045" role="img" aria-labelledby="title desc">
<title id="title">多个 SurfaceFrame 通过 display token 关联一次 DisplayFrame</title>
<desc id="desc">保留进程与layer上下文，避免只按app token去重。 多对一示意不保证每个Surface都有完整FrameTimeline覆盖；无效token、过期预测和缺包需另行处理。 Layer1通过displaytoken关联显示帧。；Layer2通过相同displaytoken关联。；另一个进程的内容也可参与同一显示帧。</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1045" fill="white"/>
<path d="M 210 215 L 210 440 L 400 440 L 400 660" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 394 650 L 400 660 L 406 650" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 215 L 600 660" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 650 L 600 660 L 606 650" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 990 215 L 990 440 L 800 440 L 800 660" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 794 650 L 800 660 L 806 650" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 70 Q 210.0 70.6 356 70 Q 360 70 360 74 L 360 211 Q 360 215 356 215 Q 210.0 214.4 64 215 Q 60 215 60 211 L 60 74 Q 60 70 64 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="210.0" y="122.1" text-anchor="middle" style="font-size:20px">
<tspan x="210.0" dy="0">进程 A / Layer 1</tspan>
<tspan x="210.0" dy="27.200000000000003">SurfaceFrame：app token A</tspan>
<tspan x="210.0" dy="27.200000000000003">display_frame_token = D</tspan>
</text>
<path d="M 454 70 Q 600.0 69.9 746 70 Q 750 70 750 74 L 750 211 Q 750 215 746 215 Q 600.0 214.3 454 215 Q 450 215 450 211 L 450 74 Q 450 70 454 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="122.1" text-anchor="middle" style="font-size:20px">
<tspan x="600.0" dy="0">进程 A / Layer 2</tspan>
<tspan x="600.0" dy="27.200000000000003">SurfaceFrame：app token A</tspan>
<tspan x="600.0" dy="27.200000000000003">display_frame_token = D</tspan>
</text>
<path d="M 844 70 Q 990.0 69.9 1136 70 Q 1140 70 1140 74 L 1140 211 Q 1140 215 1136 215 Q 990.0 215.4 844 215 Q 840 215 840 211 L 840 74 Q 840 70 844 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="990.0" y="122.1" text-anchor="middle" style="font-size:20px">
<tspan x="990.0" dy="0">进程 B / Layer 3</tspan>
<tspan x="990.0" dy="27.200000000000003">SurfaceFrame：app token B</tspan>
<tspan x="990.0" dy="27.200000000000003">display_frame_token = D</tspan>
</text>
<path d="M 184 660 Q 600.0 659.5 1016 660 Q 1020 660 1020 664 L 1020 801 Q 1020 805 1016 805 Q 600.0 805.0 184 805 Q 180 805 180 801 L 180 664 Q 180 660 184 660" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="707.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SurfaceFlinger DisplayFrame</tspan>
<tspan x="600.0" dy="34.0">DisplayFrame.token = D</tspan>
<tspan x="600.0" dy="34.0">组织本轮系统显示更新</tspan>
</text>
<text x="600" y="965" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">保留 upid + layer_name + surface token + display token；示例字母不是实际 token 值</tspan>
</text>
</svg>
