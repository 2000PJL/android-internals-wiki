<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">blocked_function 与 io_wait 是等待线索</title>
<desc id="desc">blocked_function 与 io_wait 是等待线索：等待位置不等于完整内核调用链，也不能用一个函数名把所有D-state归成同一种原因。 等待位置不等于完整内核调用链，也不能用一个函数名把所有D-state归成同一种原因。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 80 Q 210.0 80.5 371 80 Q 375 80 375 84 L 375 316 Q 375 320 371 320 Q 210.0 319.3 49 320 Q 45 320 45 316 L 45 84 Q 45 80 49 80" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">采集条件</tspan>
<tspan x="210.0" dy="28.560000000000002">sched_blocked_reason</tspan>
<tspan x="210.0" dy="28.560000000000002">限定不可中断睡眠</tspan>
<tspan x="210.0" dy="28.560000000000002">普通S futex不靠它定栈</tspan>
</text>
<path d="M 439 80 Q 600.0 80.1 761 80 Q 765 80 765 84 L 765 316 Q 765 320 761 320 Q 600.0 320.0 439 320 Q 435 320 435 316 L 435 84 Q 435 80 439 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">事件内容</tspan>
<tspan x="600.0" dy="28.560000000000002">pid / __get_wchan caller</tspan>
<tspan x="600.0" dy="28.560000000000002">in_iowait 标记</tspan>
<tspan x="600.0" dy="28.560000000000002">解析到blocked_function</tspan>
</text>
<path d="M 829 80 Q 990.0 79.3 1151 80 Q 1155 80 1155 84 L 1155 316 Q 1155 320 1151 320 Q 990.0 319.8 829 320 Q 825 320 825 316 L 825 84 Q 825 80 829 80" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">联合判断</tspan>
<tspan x="990.0" dy="28.560000000000002">符号质量 / 相邻事件</tspan>
<tspan x="990.0" dy="28.560000000000002">reclaim / 文件系统 / 驱动</tspan>
<tspan x="990.0" dy="28.560000000000002">io_wait不提供request ID</tspan>
</text>
</svg>
