<path d="M 154 245 Q 600.0 244.9 1046 245 Q 1050 245 1050 249 L 1050 366 Q 1050 370 1046 370 Q 600.0 369.8 154 370 Q 150 370 150 366 L 150 249 Q 150 245 154 245" fill="white" stroke="#4A90D9" stroke-width="3"/>
