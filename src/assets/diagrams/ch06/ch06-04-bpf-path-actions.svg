</text>
<path d="M 74 500 Q 315.0 500.1 556 500 Q 560 500 560 504 L 560 616 Q 560 620 556 620 Q 315.0 619.7 74 620 Q 70 620 70 616 L 70 504 Q 70 500 74 500" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="551.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">backing_action = REPLACE</tspan>
<tspan x="315.0" dy="34.0">携带目录 backing fd</tspan>
</text>
<path d="M 644 500 Q 885.0 500.7 1126 500 Q 1130 500 1130 504 L 1130 616 Q 1130 620 1126 620 Q 885.0 619.3 644 620 Q 640 620 640 616 L 640 504 Q 640 500 644 500" fill="white" stroke="#5BA4CF" stroke-width="3"/>
