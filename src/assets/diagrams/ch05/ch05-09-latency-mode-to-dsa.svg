<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">SetLatencyMode 实际映射到 DsaMode</title>
<desc id="desc">用已核对的枚举映射替代低延迟模式等于7.5ms的误解。 这是内部transport映射，不是普通App直接可用的Codec配置API；产品Gaming Mode还可能改变其他私有参数。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="580" fill="white"/>
<path d="M 74 50 Q 320.0 50.4 566 50 Q 570 50 570 54 L 570 216 Q 570 220 566 220 Q 320.0 219.9 74 220 Q 70 220 70 216 L 70 54 Q 70 50 74 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="320.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">FREE → DISABLED</tspan>
<tspan x="320.0" dy="34.0">关闭该 DSA 模式</tspan>
</text>
<path d="M 634 50 Q 880.0 49.7 1126 50 Q 1130 50 1130 54 L 1130 216 Q 1130 220 1126 220 Q 880.0 219.9 634 220 Q 630 220 630 216 L 630 54 Q 630 50 634 50" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="880.0" y="126.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">LOW_LATENCY → ACL</tspan>
<tspan x="880.0" dy="34.0">不是直接设置 7.5 ms LC3</tspan>
</text>
<path d="M 74 320 Q 320.0 319.9 566 320 Q 570 320 570 324 L 570 486 Q 570 490 566 490 Q 320.0 490.7 74 490 Q 70 490 70 486 L 70 324 Q 70 320 74 320" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="320.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">DYNAMIC_SPATIAL_AUDIO_SOFTWARE</tspan>
<tspan x="320.0" dy="34.0">→ ISO_SW</tspan>
</text>
<path d="M 634 320 Q 880.0 319.8 1126 320 Q 1130 320 1130 324 L 1130 486 Q 1130 490 1126 490 Q 880.0 489.3 634 490 Q 630 490 630 486 L 630 324 Q 630 320 634 320" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="880.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">DYNAMIC_SPATIAL_AUDIO_HARDWARE</tspan>
<tspan x="880.0" dy="34.0">→ ISO_HW</tspan>
</text>
</svg>
