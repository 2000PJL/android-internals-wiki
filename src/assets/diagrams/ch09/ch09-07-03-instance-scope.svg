<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">Context 缓存与 callback 的作用域</title>
<desc id="desc">Context 缓存与 callback 的作用域：应用侧映射是实例字段；系统侧按注册calling UID归组，两种作用域不能混成一个。 应用侧映射是实例字段；系统侧按注册calling UID归组，两种作用域不能混成一个。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 69.7 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 314.9 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">ContextImpl缓存</tspan>
<tspan x="210.0" dy="28.560000000000002">缓存属于Context实例</tspan>
<tspan x="210.0" dy="28.560000000000002">创建ActivityManager</tspan>
<tspan x="210.0" dy="28.560000000000002">不可当进程全局单例</tspan>
</text>
<path d="M 439 70 Q 600.0 70.3 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 315.7 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">ActivityManager实例</tspan>
<tspan x="600.0" dy="28.560000000000002">一个listener映射</tspan>
<tspan x="600.0" dy="28.560000000000002">首个注册创建callback</tspan>
<tspan x="600.0" dy="28.560000000000002">后续本实例listener复用</tspan>
</text>
<path d="M 829 70 Q 990.0 69.4 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.9 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">AMS端UID分组</tspan>
<tspan x="990.0" dy="28.560000000000002">可保存多个callback</tspan>
<tspan x="990.0" dy="28.560000000000002">同进程不同AM也可注册</tspan>
<tspan x="990.0" dy="28.560000000000002">同UID多进程也可接收</tspan>
</text>
</svg>
