<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 69.4 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 314.3 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
