<desc id="desc">Publish guard 具体装在哪里：起点是发送延迟消息的位置；fork→attach之前不在此参数内，attach入口日志也不是精确安装时刻。 起点是发送延迟消息的位置；fork→attach之前不在此参数内，attach入口日志也不是精确安装时刻。 前后依赖阶段1到2；前后依赖阶段2到3</desc>
