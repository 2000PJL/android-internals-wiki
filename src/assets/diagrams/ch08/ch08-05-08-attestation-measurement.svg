<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">证明链生成与服务端验证的观测边界</title>
<desc id="desc">证明链生成与服务端验证的观测边界：本地生成可一起返回证明链，App 不能据外层耗时精确拆开内部生成和证明；上传及验证另外计时。 本地生成可一起返回证明链，App 不能据外层耗时精确拆开内部生成和证明；上传及验证另外计时。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="410" fill="white"/>
<path d="M 49 90 Q 210.0 90.5 371 90 Q 375 90 375 94 L 375 306 Q 375 310 371 310 Q 210.0 310.7 49 310 Q 45 310 45 306 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="174.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">本地 key generation</tspan>
<tspan x="210.0" dy="34.0">可随调用取得证明链</tspan>
<tspan x="210.0" dy="34.0">内部细分需 HAL 插桩</tspan>
</text>
<path d="M 439 90 Q 600.0 89.8 761 90 Q 765 90 765 94 L 765 306 Q 765 310 761 310 Q 600.0 309.4 439 310 Q 435 310 435 306 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="174.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">网络上传</tspan>
<tspan x="600.0" dy="34.0">按实际网络请求计时</tspan>
<tspan x="600.0" dy="34.0">不记录链 / challenge 原文</tspan>
</text>
<path d="M 829 90 Q 990.0 90.5 1151 90 Q 1155 90 1155 94 L 1155 306 Q 1155 310 1151 310 Q 990.0 309.6 829 310 Q 825 310 825 306 L 825 94 Q 825 90 829 90" fill="white" stroke="#E8913A" stroke-width="3"/>
