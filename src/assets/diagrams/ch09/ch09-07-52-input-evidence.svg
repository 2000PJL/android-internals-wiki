<desc id="desc">Input 证据的关联顺序：这是分析流程，trace标记可能缺失；自动生成固定/data/anr产物不是Perfetto的一般承诺。 这是分析流程，trace标记可能缺失；自动生成固定/data/anr产物不是Perfetto的一般承诺。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
