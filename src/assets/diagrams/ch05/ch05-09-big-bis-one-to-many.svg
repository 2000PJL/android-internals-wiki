<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">BIG/BIS 的一对多广播拓扑</title>
<desc id="desc">说明广播的接收端扩展方式和无逐接收端确认。 箭头表示不同设备接收同一广播，不表示源维护逐设备媒体连接；广播加入成本在后文另图展开。 源发送BIG中的BIS；A同步BIS；B同步BIS；C同步BIS</desc>
