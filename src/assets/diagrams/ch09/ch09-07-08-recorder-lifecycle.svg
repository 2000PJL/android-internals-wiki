<title id="title">有界 recorder 的生命周期</title>
<desc id="desc">有界 recorder 的生命周期：容量16是教学参数；内存记录可能丢失，示例未实现跨启动持久化，也不保证回调必达。 容量16是教学参数；内存记录可能丢失，示例未实现跨启动持久化，也不保证回调必达。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
