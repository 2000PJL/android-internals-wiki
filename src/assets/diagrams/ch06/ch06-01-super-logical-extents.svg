<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc">
<title id="title">super 容器与逻辑分区的 extent 映射</title>
<desc id="desc">避免把导图里的相邻块当作固定物理分区表。 图内extent仅为概念示例，不提供实际地址、容量或断言固定相邻关系；bootloader所需物理分区按产品核对。 逻辑分区通过映射表定位extents；映射到super物理区间</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1090" fill="white"/>
<path d="M 600 200 L 600 300" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 290 L 600 300 L 606 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 450 L 600 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 540 L 600 550 L 606 540" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 124 50 Q 600.0 49.4 1076 50 Q 1080 50 1080 54 L 1080 196 Q 1080 200 1076 200 Q 600.0 200.4 124 200 Q 120 200 120 196 L 120 54 Q 120 50 124 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">逻辑分区：system / vendor / product / odm</tspan>
<tspan x="600.0" dy="34.0">每个分区有自己的逻辑地址空间</tspan>
</text>
<path d="M 124 300 Q 600.0 300.6 1076 300 Q 1080 300 1080 304 L 1080 446 Q 1080 450 1076 450 Q 600.0 450.4 124 450 Q 120 450 120 446 L 120 304 Q 120 300 124 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="366.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">dm-linear / liblp 映射表</tspan>
<tspan x="600.0" dy="34.0">逻辑范围 → super 内一个或多个物理 extent</tspan>
</text>
<path d="M 124 550 Q 600.0 550.8 1076 550 Q 1080 550 1080 554 L 1080 726 Q 1080 730 1076 730 Q 600.0 730.4 124 730 Q 120 730 120 726 L 120 554 Q 120 550 124 550" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="614.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">物理分区 super（示意）</tspan>
<tspan x="600.0" dy="34.0">[system A] [vendor] [system B] [空闲] [其他…]</tspan>
<tspan x="600.0" dy="34.0">一个逻辑分区不必占单个连续物理范围</tspan>
</text>
<path d="M 124 830 Q 600.0 830.3 1076 830 Q 1080 830 1080 834 L 1080 976 Q 1080 980 1076 980 Q 600.0 979.9 124 980 Q 120 980 120 976 L 120 834 Q 120 830 124 830" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="896.8399999999999" text-anchor="middle" style="font-size:24px">
<tspan x="600.0" dy="0">super 外的物理分区</tspan>
<tspan x="600.0" dy="32.64">boot / init_boot / vendor_boot / dtbo / vbmeta 等按设备布局</tspan>
</text>
</svg>
