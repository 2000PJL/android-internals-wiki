<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
<title id="title">2 秒、5 秒、10 秒的不同对象</title>
<desc id="desc">2 秒、5 秒、10 秒的不同对象：这些常量不构成2秒预警、5秒ANR、10秒丢弃的统一状态机；先确认每条路径监视的对象。 这些常量不构成2秒预警、5秒ANR、10秒丢弃的统一状态机；先确认每条路径监视的对象。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="555" fill="white"/>
<path d="M 49 45 Q 310.0 44.6 571 45 Q 575 45 575 49 L 575 231 Q 575 235 571 235 Q 310.0 234.9 49 235 Q 45 235 45 231 L 45 49 Q 45 45 49 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="310.0" y="116.53999999999999" text-anchor="middle" style="font-size:23px">
<tspan x="310.0" dy="0">slow-event warning</tspan>
<tspan x="310.0" dy="31.28">2秒日志阈值</tspan>
<tspan x="310.0" dy="31.28">用于事件处理慢的诊断</tspan>
</text>
<path d="M 629 45 Q 890.0 44.5 1151 45 Q 1155 45 1155 49 L 1155 231 Q 1155 235 1151 235 Q 890.0 234.7 629 235 Q 625 235 625 231 L 625 49 Q 625 45 629 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="890.0" y="116.53999999999999" text-anchor="middle" style="font-size:23px">
<tspan x="890.0" dy="0">pre-ANR window</tspan>
<tspan x="890.0" dy="31.28">2000ms × HW</tspan>
<tspan x="890.0" dy="31.28">用于反推no-focus预定点</tspan>
</text>
<path d="M 49 300 Q 310.0 299.5 571 300 Q 575 300 575 304 L 575 486 Q 575 490 571 490 Q 310.0 490.4 49 490 Q 45 490 45 486 L 45 304 Q 45 300 49 300" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="310.0" y="371.54" text-anchor="middle" style="font-size:23px">
<tspan x="310.0" dy="0">dispatch timeout</tspan>
<tspan x="310.0" dy="31.28">5000ms × HW只是fallback</tspan>
<tspan x="310.0" dy="31.28">实际可来自application/window</tspan>
</text>
<path d="M 629 300 Q 890.0 300.2 1151 300 Q 1155 300 1155 304 L 1155 486 Q 1155 490 1151 490 Q 890.0 490.4 629 490 Q 625 490 625 486 L 625 304 Q 625 300 629 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="890.0" y="371.54" text-anchor="middle" style="font-size:23px">
<tspan x="890.0" dy="0">stale-event timeout</tspan>
<tspan x="890.0" dy="31.28">10秒 × HW</tspan>
<tspan x="890.0" dy="31.28">用于dispatcher的陈旧事件判断</tspan>
</text>
</svg>
