<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">BPF/backing 的目录范围与安装动作</title>
<desc id="desc">区分目录backing fd与passthrough backing_id。 动作字段分别作用于backing与BPF；不外推DCIM/Pictures/Download或所有卷同样受益。 在主卷范围判断对应目录；安装lower目录关系；按情况设置BPF动作；backing参与后续文件操作；BPF参与后续操作选择</desc>
