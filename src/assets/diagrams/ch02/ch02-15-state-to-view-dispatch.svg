<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc">
<title id="title">InsetsState 到 View 树：先更新状态，再安排 traversal</title>
<desc id="desc">展示WMS状态输入与应用本地重新请求分发的汇合点。 绘制主路径简化；实际relayout、resize、动画等可多次更新状态，不预设回调次数。 系统状态送入当前窗口。；变化的状态请求重新应用。；本地请求也设置待分发状态。；实际traversal进行分发。</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1440" fill="white"/>
<path d="M 305 170 L 305 370" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 299 360 L 305 370 L 311 360" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 305 480 L 305 610 L 450 610 L 450 730" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 444 720 L 450 730 L 456 720" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 895 480 L 895 610 L 750 610 L 750 730" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 744 720 L 750 730 L 756 720" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 875 L 600 1130" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 1120 L 600 1130 L 606 1120" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 64 60 Q 305.0 60.7 546 60 Q 550 60 550 64 L 550 166 Q 550 170 546 170 Q 305.0 169.5 64 170 Q 60 170 60 166 L 60 64 Q 60 60 64 60" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="305.0" dy="0">WMS / InsetsStateController</tspan>
<tspan x="305.0" dy="34.0">InsetsSourceProvider</tspan>
</text>
<path d="M 64 370 Q 305.0 369.5 546 370 Q 550 370 550 374 L 550 476 Q 550 480 546 480 Q 305.0 479.9 64 480 Q 60 480 60 476 L 60 374 Q 60 370 64 370" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="305.0" y="417.18" text-anchor="middle" style="font-size:23px">
<tspan x="305.0" dy="0">ViewRootImpl / InsetsController</tspan>
<tspan x="305.0" dy="31.28">onStateChanged → notifyInsetsChanged</tspan>
</text>
<path d="M 654 370 Q 895.0 370.4 1136 370 Q 1140 370 1140 374 L 1140 476 Q 1140 480 1136 480 Q 895.0 479.6 654 480 Q 650 480 650 476 L 650 374 Q 650 370 654 370" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="895.0" y="416.5" text-anchor="middle" style="font-size:25px">
<tspan x="895.0" dy="0">应用 View.requestApplyInsets()</tspan>
<tspan x="895.0" dy="34.0">请求本窗口重新分发</tspan>
</text>
<path d="M 184 730 Q 600.0 729.5 1016 730 Q 1020 730 1020 734 L 1020 871 Q 1020 875 1016 875 Q 600.0 875.4 184 875 Q 180 875 180 871 L 180 734 Q 180 730 184 730" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="777.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ViewRootImpl</tspan>
<tspan x="600.0" dy="34.0">mApplyInsetsRequested / requestLayout</tspan>
<tspan x="600.0" dy="34.0">按需 scheduleTraversals</tspan>
</text>
<path d="M 124 1130 Q 600.0 1129.4 1076 1130 Q 1080 1130 1080 1134 L 1080 1236 Q 1080 1240 1076 1240 Q 600.0 1240.1 124 1240 Q 120 1240 120 1236 L 120 1134 Q 120 1130 124 1130" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="1176.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">performTraversals → dispatchApplyInsets(root)</tspan>
<tspan x="600.0" dy="34.0">WindowInsets → root.dispatchApplyWindowInsets → View 树</tspan>
</text>
<text x="600" y="1360" text-anchor="middle" style="font-size:22px">
<tspan x="600" dy="0">requestApplyInsets 不保证产生新的 WMS 状态；type mask 合并不意味着每种 type 一次 Binder</tspan>
</text>
</svg>
