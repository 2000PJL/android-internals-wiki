<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">AoS、SoA 与 AoSoA 的地址组织</title>
<desc id="desc">让字段排列跟随热循环实际读取的内容。 不承诺AoS每个对象独占64B行；示意相邻对象可共行或跨行，实际流量还含预取与写回。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="780" fill="white"/>
<path d="M 104 50 Q 600.0 49.5 1096 50 Q 1100 50 1100 54 L 1100 196 Q 1100 200 1096 200 Q 600.0 199.9 104 200 Q 100 200 100 196 L 100 54 Q 100 50 104 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="116.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AoS：每个元素的字段在一起</tspan>
<tspan x="600.0" dy="34.0">[P0：xyz | vxyz | rgba][P1：xyz | vxyz | rgba]…</tspan>
</text>
<path d="M 104 300 Q 600.0 299.5 1096 300 Q 1100 300 1100 304 L 1100 456 Q 1100 460 1096 460 Q 600.0 459.4 104 460 Q 100 460 100 456 L 100 304 Q 100 300 104 300" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="371.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SoA：同一字段跨元素连续</tspan>
<tspan x="600.0" dy="34.0">x：[x0 x1 x2…]  y：[y0 y1 y2…]  z：[z0 z1 z2…]</tspan>
</text>
<path d="M 104 560 Q 600.0 559.2 1096 560 Q 1100 560 1100 564 L 1100 706 Q 1100 710 1096 710 Q 600.0 709.7 104 710 Q 100 710 100 706 L 100 564 Q 100 560 104 560" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="626.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AoSoA：按 SIMD 宽度或 tile 分组</tspan>
<tspan x="600.0" dy="34.0">每个小块保留多字段数组，兼顾批量与单元素访问</tspan>
</text>
</svg>
