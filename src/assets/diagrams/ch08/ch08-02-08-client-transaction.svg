<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">从 ClientTransaction 到 Activity 与 UI</title>
<desc id="desc">从 ClientTransaction 到 Activity 与 UI：LaunchActivityItem 驱动创建；前台目标按事务执行后续生命周期，XML inflate 只是一种 UI 路径。 LaunchActivityItem 驱动创建；前台目标按事务执行后续生命周期，XML inflate 只是一种 UI 路径。 前一步为后续步骤提供条件；前一步为后续步骤提供条件；前一步为后续步骤提供条件</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="780" fill="white"/>
<path d="M 600 160 L 600 220" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 210 L 600 220 L 606 210" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 340 L 600 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 390 L 600 400 L 606 390" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 520 L 600 580" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 570 L 600 580 L 606 570" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 40 Q 600.0 40.3 1096 40 Q 1100 40 1100 44 L 1100 156 Q 1100 160 1096 160 Q 600.0 160.4 104 160 Q 100 160 100 156 L 100 44 Q 100 40 104 40" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">服务端构建生命周期事务</tspan>
<tspan x="600.0" dy="34.0">LaunchActivityItem；需前台时附 ResumeActivityItem</tspan>
</text>
<path d="M 104 220 Q 600.0 220.7 1096 220 Q 1100 220 1100 224 L 1100 336 Q 1100 340 1096 340 Q 600.0 340.1 104 340 Q 100 340 100 336 L 100 224 Q 100 220 104 220" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="271.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">App：LaunchActivityItem.execute()</tspan>
<tspan x="600.0" dy="34.0">handleLaunchActivity → performLaunchActivity</tspan>
</text>
<path d="M 104 400 Q 600.0 400.2 1096 400 Q 1100 400 1100 404 L 1100 516 Q 1100 520 1096 520 Q 600.0 519.4 104 520 Q 100 520 100 516 L 100 404 Q 100 400 104 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="451.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">创建 Activity / Context，attach 并调用 onCreate</tspan>
<tspan x="600.0" dy="34.0">页面可在回调中准备 UI / ViewModel / saved state</tspan>
</text>
<path d="M 104 580 Q 600.0 580.2 1096 580 Q 1100 580 1100 584 L 1100 696 Q 1100 700 1096 700 Q 600.0 699.4 104 700 Q 100 700 100 696 L 100 584 Q 100 580 104 580" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="631.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">TransactionExecutor 继续所需 onStart / onResume</tspan>
<tspan x="600.0" dy="34.0">UI 也可在后续回调 / 遍历中继续；并不强制 XML inflate</tspan>
</text>
</svg>
