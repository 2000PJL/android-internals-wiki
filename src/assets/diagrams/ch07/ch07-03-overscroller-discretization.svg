<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">OverScroller 的三处离散化</title>
<desc id="desc">按正常SPLINE路径分清时间、查表近似和像素取整。 源码机制图，不把查表或取整直接等同用户可见抖动；限普通SPLINE更新路径。 按机制继续追踪；按机制继续追踪；按机制继续追踪</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="960" fill="white"/>
<path d="M 600 185 L 600 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 280 L 600 290 L 606 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 430 L 600 535" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 525 L 600 535 L 606 525" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 675 L 600 780" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 770 L 600 780 L 606 770" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.8 1046 45 Q 1050 45 1050 49 L 1050 181 Q 1050 185 1046 185 Q 600.0 184.8 154 185 Q 150 185 150 181 L 150 49 Q 150 45 154 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">AnimationUtils 的整数毫秒读数</tspan>
<tspan x="600.0" dy="34.0">currentTime = time − mStartTime</tspan>
</text>
<path d="M 154 290 Q 600.0 290.1 1046 290 Q 1050 290 1050 294 L 1050 426 Q 1050 430 1046 430 Q 600.0 429.5 154 430 Q 150 430 150 426 L 150 294 Q 150 290 154 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">SPLINE 正常减速分支</tspan>
<tspan x="600.0" dy="34.0">t = currentTime / mSplineDuration</tspan>
</text>
<path d="M 154 535 Q 600.0 534.6 1046 535 Q 1050 535 1050 539 L 1050 671 Q 1050 675 1046 675 Q 600.0 675.4 154 675 Q 150 675 150 671 L 150 539 Q 150 535 154 535" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="596.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">101 个位置采样点之间线性插值</tspan>
<tspan x="600.0" dy="34.0">用 distanceCoef × mSplineDistance 得到距离</tspan>
</text>
<path d="M 154 780 Q 600.0 780.4 1046 780 Q 1050 780 1050 784 L 1050 916 Q 1050 920 1046 920 Q 600.0 920.6 154 920 Q 150 920 150 916 L 150 784 Q 150 780 154 780" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="841.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">整数位置输出</tspan>
<tspan x="600.0" dy="34.0">mCurrentPosition = mStart + round(distance)</tspan>
</text>
</svg>
