<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc">
<title id="title">f2fs_need_SSR 的判断次序</title>
<desc id="desc">保留mode=lfs优先级，并显示运行时空间需求而非固定百分比。 need_SSR返回需要与否，不承诺SSR分配一定成功；保留源码&lt;=比较与dentry的2倍系数。 lfs模式优先排除；非lfs继续检查特殊状态；特殊状态要求SSR；常规模式进入阈值比较；输出需要SSR的判断</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="895" fill="white"/>
<path d="M 780 87 L 860 87" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 81 L 860 87 L 850 93" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 135 L 450 245" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 444 235 L 450 245 L 456 235" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 780 302 L 860 302" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 296 L 860 302 L 850 308" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 450 360 L 450 470" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 444 460 L 450 470 L 456 460" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 630 635 L 630 735" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 624 725 L 630 735 L 636 725" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 124 40 Q 450.0 40.6 776 40 Q 780 40 780 44 L 780 131 Q 780 135 776 135 Q 450.0 135.5 124 135 Q 120 135 120 131 L 120 44 Q 120 40 124 40" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="450.0" y="96.0" text-anchor="middle" style="font-size:25px">
<tspan x="450.0" dy="0">mode=lfs？</tspan>
</text>
<path d="M 864 40 Q 1000.0 40.3 1136 40 Q 1140 40 1140 44 L 1140 131 Q 1140 135 1136 135 Q 1000.0 134.9 864 135 Q 860 135 860 131 L 860 44 Q 860 40 864 40" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="1000.0" y="96.0" text-anchor="middle" style="font-size:25px">
<tspan x="1000.0" dy="0">是：不需要 SSR</tspan>
</text>
<path d="M 124 245 Q 450.0 244.3 776 245 Q 780 245 780 249 L 780 356 Q 780 360 776 360 Q 450.0 360.0 124 360 Q 120 360 120 356 L 120 249 Q 120 245 124 245" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="450.0" y="311.0" text-anchor="middle" style="font-size:25px">
<tspan x="450.0" dy="0">GC_URGENT_HIGH 或 checkpoint disabled？</tspan>
</text>
<path d="M 864 245 Q 1000.0 245.0 1136 245 Q 1140 245 1140 249 L 1140 356 Q 1140 360 1136 360 Q 1000.0 360.0 864 360 Q 860 360 860 356 L 860 249 Q 860 245 864 245" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="1000.0" y="311.0" text-anchor="middle" style="font-size:25px">
<tspan x="1000.0" dy="0">是：需要 SSR</tspan>
</text>
<path d="M 124 470 Q 630.0 470.1 1136 470 Q 1140 470 1140 474 L 1140 631 Q 1140 635 1136 635 Q 630.0 635.6 124 635 Q 120 635 120 631 L 120 474 Q 120 470 124 470" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="630.0" y="527.0" text-anchor="middle" style="font-size:25px">
<tspan x="630.0" dy="0">否则比较 free sections ≤ 运行时需求</tspan>
<tspan x="630.0" dy="34.0">node_secs + 2×dent_secs + imeta_secs</tspan>
<tspan x="630.0" dy="34.0">+ min_ssr_sections + reserved_sections</tspan>
</text>
<path d="M 124 735 Q 630.0 735.0 1136 735 Q 1140 735 1140 739 L 1140 826 Q 1140 830 1136 830 Q 630.0 830.7 124 830 Q 120 830 120 826 L 120 739 Q 120 735 124 735" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="630.0" y="791.0" text-anchor="middle" style="font-size:25px">
<tspan x="630.0" dy="0">比较成立才需要 SSR；能否找到可复用段还需后续分配检查</tspan>
</text>
<rect x="475.5" y="175.0" width="39.0" height="36.3" fill="white"/>
<text x="495" y="200" text-anchor="middle" style="font-size:23px">
<tspan x="495" dy="0">否</tspan>
</text>
<rect x="475.5" y="395.0" width="39.0" height="36.3" fill="white"/>
<text x="495" y="420" text-anchor="middle" style="font-size:23px">
<tspan x="495" dy="0">否</tspan>
</text>
</svg>
