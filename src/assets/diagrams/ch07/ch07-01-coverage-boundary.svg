<path d="M 154 535 Q 600.0 534.6 1046 535 Q 1050 535 1050 539 L 1050 681 Q 1050 685 1046 685 Q 600.0 685.2 154 685 Q 150 685 150 681 L 150 539 Q 150 535 154 535" fill="white" stroke="#4CAF50" stroke-width="3"/>
