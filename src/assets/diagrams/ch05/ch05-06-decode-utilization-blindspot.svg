<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">Decode 的交接与利用率盲区</title>
<desc id="desc">用 CPU 和加速器交替工作解释平均利用率为何不足以诊断。 具体runtime可重叠提交或推测解码，不承诺每token恰好一个kernel或回调。 依赖提交；等待本轮结果后采样</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="625" fill="white"/>
<path d="M 380 110 L 445 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 435 104 L 445 110 L 435 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 755 110 L 820 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 810 104 L 820 110 L 810 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 50 Q 225.0 49.3 376 50 Q 380 50 380 54 L 380 166 Q 380 170 376 170 Q 225.0 170.0 74 170 Q 70 170 70 166 L 70 54 Q 70 50 74 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="225.0" y="118.5" text-anchor="middle" style="font-size:25px">
<tspan x="225.0" dy="0">CPU 提交本轮工作</tspan>
</text>
<path d="M 449 50 Q 600.0 50.7 751 50 Q 755 50 755 54 L 755 166 Q 755 170 751 170 Q 600.0 169.2 449 170 Q 445 170 445 166 L 445 54 Q 445 50 449 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="118.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">加速器执行并完成</tspan>
</text>
<path d="M 824 50 Q 975.0 50.1 1126 50 Q 1130 50 1130 54 L 1130 166 Q 1130 170 1126 170 Q 975.0 170.7 824 170 Q 820 170 820 166 L 820 54 Q 820 50 824 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="975.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="975.0" dy="0">CPU 读取 / 采样</tspan>
<tspan x="975.0" dy="34.0">形成下一轮依赖</tspan>
</text>
<text x="600" y="555" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">诊断要对齐：token → 调度 → 频率 → 带宽 / 内存 → 能量与温度</tspan>
</text>
<text x="206" y="296" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">CPU</tspan>
</text>
<path d="M 220 312 H 1080" stroke="#777777" stroke-width="1.5"/>
<path d="M 224 273 Q 330.0 273.0 436 273 Q 440 273 440 277 L 440 306 Q 440 310 436 310 Q 330.0 309.2 224 310 Q 220 310 220 306 L 220 277 Q 220 273 224 273" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="330.0" y="299" text-anchor="middle" style="font-size:21px">
<tspan x="330.0" dy="0">提交</tspan>
</text>
<path d="M 744 273 Q 850.0 273.7 956 273 Q 960 273 960 277 L 960 306 Q 960 310 956 310 Q 850.0 310.7 744 310 Q 740 310 740 306 L 740 277 Q 740 273 744 273" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="850.0" y="299" text-anchor="middle" style="font-size:21px">
<tspan x="850.0" dy="0">读取 / 采样</tspan>
</text>
<text x="206" y="406" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">加速器</tspan>
</text>
<path d="M 220 422 H 1080" stroke="#777777" stroke-width="1.5"/>
<path d="M 444 383 Q 590.0 383.4 736 383 Q 740 383 740 387 L 740 416 Q 740 420 736 420 Q 590.0 419.4 444 420 Q 440 420 440 416 L 440 387 Q 440 383 444 383" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="590.0" y="409" text-anchor="middle" style="font-size:21px">
<tspan x="590.0" dy="0">执行</tspan>
</text>
</svg>
