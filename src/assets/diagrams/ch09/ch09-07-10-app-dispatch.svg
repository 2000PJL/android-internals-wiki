<title id="title">Binder 到 listener executor 的分派</title>
<desc id="desc">Binder 到 listener executor 的分派：oneway返回不代表listener已执行；多个listener的通知和执行没有统一顺序保证。 oneway返回不代表listener已执行；多个listener的通知和执行没有统一顺序保证。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
