<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
<title id="title">post 之后是并发关系</title>
<desc id="desc">post 之后是并发关系：handler在任务投递后即可运行；客户端收到Binder回复与handler开始之间没有固定先后，不等待listener或显示完成。 handler在任务投递后即可运行；客户端收到Binder回复与handler开始之间没有固定先后，不等待listener或显示完成。 同步线程向调用者回复；任务可在返回前运行；异步分发到消费者</desc>
