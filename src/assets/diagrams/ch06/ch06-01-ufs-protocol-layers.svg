<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">UFS 的命令、传输与互连层</title>
<desc id="desc">避免把UniPro压缩成只有数据链路层。 层名按UFS功能组织，UniPro自身也有传输层，不能将图机械映射为一条通用OSI栈。 依次进入下一阶段；依次进入下一阶段；依次进入下一阶段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1020" fill="white"/>
<path d="M 600 190 L 600 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 280 L 600 290 L 606 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 430 L 600 530" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 520 L 600 530 L 606 520" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 670 L 600 770" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 760 L 600 770 L 606 760" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 124 50 Q 600.0 50.2 1076 50 Q 1080 50 1080 54 L 1080 186 Q 1080 190 1076 190 Q 600.0 190.3 124 190 Q 120 190 120 186 L 120 54 Q 120 50 124 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">UFS Application Layer</tspan>
<tspan x="600.0" dy="34.0">UCS：基于 SCSI 的命令语义</tspan>
</text>
<path d="M 124 290 Q 600.0 289.9 1076 290 Q 1080 290 1080 294 L 1080 426 Q 1080 430 1076 430 Q 600.0 429.5 124 430 Q 120 430 120 426 L 120 294 Q 120 290 124 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="351.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">UFS Transport Protocol（UTP）</tspan>
<tspan x="600.0" dy="34.0">以 UPIU 等协议单元承载命令与数据</tspan>
</text>
<path d="M 124 530 Q 600.0 530.1 1076 530 Q 1080 530 1080 534 L 1080 666 Q 1080 670 1076 670 Q 600.0 669.8 124 670 Q 120 670 120 666 L 120 534 Q 120 530 124 530" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="591.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">UFS Interconnect（UIC）中的 UniPro</tspan>
<tspan x="600.0" dy="34.0">提供传输、网络与数据链路等互连功能</tspan>
</text>
<path d="M 124 770 Q 600.0 769.8 1076 770 Q 1080 770 1080 774 L 1080 906 Q 1080 910 1076 910 Q 600.0 909.6 124 910 Q 120 910 120 906 L 120 774 Q 120 770 124 770" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="831.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">MIPI M-PHY</tspan>
<tspan x="600.0" dy="34.0">串行物理链路，连接 host 与 device</tspan>
</text>
</svg>
