<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Activity/Service 等待与广播回执排队分开</title>
<desc id="desc">Activity/Service 等待与广播回执排队分开：两条路径都可能拖住系统完成信号；waitToFinish不仅处理SharedPreferences任务。 两条路径都可能拖住系统完成信号；waitToFinish不仅处理SharedPreferences任务。 左侧条件；右侧条件</desc>
