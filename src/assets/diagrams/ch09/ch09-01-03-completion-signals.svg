<rect width="1200" height="400" fill="white"/>
<path d="M 49 80 Q 210.0 79.8 371 80 Q 375 80 375 84 L 375 316 Q 375 320 371 320 Q 210.0 320.0 49 320 Q 45 320 45 316 L 45 84 Q 45 80 49 80" fill="white" stroke="#5BA4CF" stroke-width="3"/>
