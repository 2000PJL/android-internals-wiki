<path d="M 315 490 L 315 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 680 L 315 690 L 321 680" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 490 L 885 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 680 L 885 690 L 891 680" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.7 1046 45 Q 1050 45 1050 49 L 1050 171 Q 1050 175 1046 175 Q 600.0 174.2 154 175 Q 150 175 150 171 L 150 49 Q 150 45 154 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">应用 Actual SurfaceFrame</tspan>
<tspan x="600.0" dy="34.0">slice ID + PID + layer + surface token</tspan>
</text>
<path d="M 74 350 Q 315.0 350.4 556 350 Q 560 350 560 354 L 560 486 Q 560 490 556 490 Q 315.0 490.5 74 490 Q 70 490 70 486 L 70 354 Q 70 350 74 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="315.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">对照 Expected</tspan>
<tspan x="315.0" dy="34.0">窗口起止 / on-time finish</tspan>
</text>
<path d="M 644 350 Q 885.0 350.2 1126 350 Q 1130 350 1130 354 L 1130 486 Q 1130 490 1126 490 Q 885.0 489.3 644 490 Q 640 490 640 486 L 640 354 Q 640 350 644 350" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="885.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">读取结果与邻帧</tspan>
<tspan x="885.0" dy="34.0">jank / present / prediction / dropped</tspan>
</text>
<path d="M 154 690 Q 600.0 690.0 1046 690 Q 1050 690 1050 694 L 1050 826 Q 1050 830 1046 830 Q 600.0 830.0 154 830 Q 150 830 150 826 L 150 694 Q 150 690 154 690" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="751.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">沿 flow / display token 找显示帧</tspan>
<tspan x="600.0" dy="34.0">一个 DisplayFrame 可合成多 layer</tspan>
</text>
</svg>
