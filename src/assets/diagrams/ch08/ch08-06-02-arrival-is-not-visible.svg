<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">接受、回调、调用返回与可见是不同端点</title>
<desc id="desc">接受、回调、调用返回与可见是不同端点：每个事件说明自己的层次；没有公开 App API 能把 FCM 接受、平台分发与用户可见合成同一端点。 每个事件说明自己的层次；没有公开 App API 能把 FCM 接受、平台分发与用户可见合成同一端点。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="410" fill="white"/>
<path d="M 49 90 Q 210.0 90.5 371 90 Q 375 90 375 94 L 375 306 Q 375 310 371 310 Q 210.0 310.8 49 310 Q 45 310 45 306 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="178.57999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">云端与 SDK</tspan>
<tspan x="210.0" dy="28.560000000000002">fcm accepted / callback</tspan>
<tspan x="210.0" dy="28.560000000000002">不等于通知显示</tspan>
</text>
<path d="M 439 90 Q 600.0 89.8 761 90 Q 765 90 765 94 L 765 306 Q 765 310 761 310 Q 600.0 309.5 439 310 Q 435 310 435 306 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="178.57999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">平台调用</tspan>
<tspan x="600.0" dy="28.560000000000002">notify 返回 / NMS record</tspan>
<tspan x="600.0" dy="28.560000000000002">不等于 SystemUI 已完成</tspan>
</text>
<path d="M 829 90 Q 990.0 90.7 1151 90 Q 1155 90 1155 94 L 1155 306 Q 1155 310 1151 310 Q 990.0 309.4 829 310 Q 825 310 825 306 L 825 94 Q 825 90 829 90" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="178.57999999999998" text-anchor="middle" style="font-size:21px">
