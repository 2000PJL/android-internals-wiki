<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">ANR Detected 本身不标明 Provider reason</title>
<desc id="desc">ANR Detected 本身不标明 Provider reason：不能仅靠instant名字分类，也不能因未搜到就排除ANR；日志、记录与trace覆盖须一起核对。 不能仅靠instant名字分类，也不能因未搜到就排除ANR；日志、记录与trace覆盖须一起核对。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 70.7 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 315.4 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">可用性条件</tspan>
<tspan x="210.0" dy="28.560000000000002">相应信息开关</tspan>
<tspan x="210.0" dy="28.560000000000002">anrInfo非空</tspan>
<tspan x="210.0" dy="28.560000000000002">采到debug.anr类别</tspan>
</text>
<path d="M 439 70 Q 600.0 70.3 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 315.5 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">instant携带</tspan>
<tspan x="600.0" dy="28.560000000000002">pid / anrId / errorId</tspan>
<tspan x="600.0" dy="28.560000000000002">anrTimeoutMs等字段</tspan>
<tspan x="600.0" dy="28.560000000000002">没有Provider reason字段</tspan>
</text>
<path d="M 829 70 Q 990.0 69.7 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.3 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="156.8" text-anchor="middle" style="font-size:21px">
