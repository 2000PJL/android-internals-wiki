<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">预警点的三个 timeout 算例</title>
<desc id="desc">预警点的三个 timeout 算例：这些是公式算例，实际到达和执行仍受调度影响；2000ms参数不是App诊断窗口SLA。 这些是公式算例，实际到达和执行仍受调度影响；2000ms参数不是App诊断窗口SLA。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 70.7 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 315.3 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">D = 5000ms，HW=1</tspan>
<tspan x="210.0" dy="28.560000000000002">pre_window=max(2500,2000)</tspan>
<tspan x="210.0" dy="28.560000000000002">预定消耗2500ms</tspan>
<tspan x="210.0" dy="28.560000000000002">恰好在一半</tspan>
</text>
<path d="M 439 70 Q 600.0 70.0 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 315.3 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">D = 3000ms，HW=1</tspan>
<tspan x="600.0" dy="28.560000000000002">pre_window=max(1500,2000)</tspan>
<tspan x="600.0" dy="28.560000000000002">预定消耗1000ms</tspan>
<tspan x="600.0" dy="28.560000000000002">早于一半</tspan>
</text>
<path d="M 829 70 Q 990.0 69.4 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.3 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">D = 1000ms，HW=1</tspan>
<tspan x="990.0" dy="28.560000000000002">pre_window=max(500,2000)</tspan>
<tspan x="990.0" dy="28.560000000000002">warning_at早于建立状态</tspan>
<tspan x="990.0" dy="28.560000000000002">首次检查即可满足</tspan>
</text>
</svg>
