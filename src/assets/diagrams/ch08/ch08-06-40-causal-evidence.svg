<title id="title">时间窗相关性与单条通知因果链分开</title>
<desc id="desc">时间窗相关性与单条通知因果链分开：缺少 notification key 或平台事件关联时只能报告同窗繁忙；Binder 源码也不能证明 FCM 云端传输耗时。 缺少 notification key 或平台事件关联时只能报告同窗繁忙；Binder 源码也不能证明 FCM 云端传输耗时。 </desc>
