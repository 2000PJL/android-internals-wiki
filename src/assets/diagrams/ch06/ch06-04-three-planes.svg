<tspan x="600.0" dy="34.0">建立卷挂载与 FUSE 会话</tspan>
</text>
<path d="M 154 275 Q 600.0 275.5 1046 275 Q 1050 275 1050 279 L 1050 391 Q 1050 395 1046 395 Q 600.0 395.3 154 395 Q 150 395 150 391 L 150 279 Q 150 275 154 275" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="326.5" text-anchor="middle" style="font-size:25px">
