<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">同名并发事件用不同 cookie 配对</title>
<desc id="desc">同名并发事件用不同 cookie 配对：async 事件可跨线程、非嵌套，但必须以同一 name 和 cookie 恰好结束一次；cookie 不用敏感 token 生成。 async 事件可跨线程、非嵌套，但必须以同一 name 和 cookie 恰好结束一次；cookie 不用敏感 token 生成。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="410" fill="white"/>
<path d="M 49 90 Q 210.0 89.2 371 90 Q 375 90 375 94 L 375 316 Q 375 320 371 320 Q 210.0 319.7 49 320 Q 45 320 45 316 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="183.57999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">动作 A / cookie 101</tspan>
<tspan x="210.0" dy="28.560000000000002">begin → 终态 end</tspan>
<tspan x="210.0" dy="28.560000000000002">只结束自己的事件</tspan>
</text>
<path d="M 439 90 Q 600.0 89.9 761 90 Q 765 90 765 94 L 765 316 Q 765 320 761 320 Q 600.0 319.7 439 320 Q 435 320 435 316 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="183.57999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">动作 B / cookie 102</tspan>
<tspan x="600.0" dy="28.560000000000002">可与 A 重叠或先结束</tspan>
<tspan x="600.0" dy="28.560000000000002">不按嵌套栈配对</tspan>
</text>
<path d="M 829 90 Q 990.0 89.7 1151 90 Q 1155 90 1155 94 L 1155 316 Q 1155 320 1151 320 Q 990.0 320.8 829 320 Q 825 320 825 316 L 825 94 Q 825 90 829 90" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="183.57999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">分配与回收规则</tspan>
<tspan x="990.0" dy="28.560000000000002">同名在途 cookie 唯一</tspan>
<tspan x="990.0" dy="28.560000000000002">结束后才可复用</tspan>
</text>
</svg>
