<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">MediaProvider 的两种入口</title>
<desc id="desc">区分ContentProvider Binder入口与FUSE请求入口。 两条入口示意；右侧是需要daemon的操作，缓存或内核快速路径可能省掉某次用户态往返。 URI调用经Binder到Provider；文件系统请求经FUSE到daemon；Provider返回适当fd；FUSE处理底层媒体请求</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="770" fill="white"/>
<path d="M 315 170 L 315 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 280 L 315 290 L 321 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 170 L 885 290" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 280 L 885 290 L 891 280" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 315 420 L 315 560" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 550 L 315 560 L 321 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 420 L 885 560" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 550 L 885 560 L 891 550" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 50 Q 315.0 50.0 556 50 Q 560 50 560 54 L 560 166 Q 560 170 556 170 Q 315.0 170.7 74 170 Q 70 170 70 166 L 70 54 Q 70 50 74 50" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">ContentResolver</tspan>
<tspan x="315.0" dy="34.0">query / open URI</tspan>
</text>
<path d="M 644 50 Q 885.0 49.3 1126 50 Q 1130 50 1130 54 L 1130 166 Q 1130 170 1126 170 Q 885.0 170.5 644 170 Q 640 170 640 166 L 640 54 Q 640 50 644 50" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="885.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">File / NDK</tspan>
<tspan x="885.0" dy="34.0">直接路径 syscall</tspan>
</text>
<path d="M 74 290 Q 315.0 290.6 556 290 Q 560 290 560 294 L 560 416 Q 560 420 556 420 Q 315.0 419.6 74 420 Q 70 420 70 416 L 70 294 Q 70 290 74 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="315.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">Binder → MediaProvider</tspan>
<tspan x="315.0" dy="34.0">媒体索引 / URI 授权</tspan>
</text>
<path d="M 644 290 Q 885.0 289.8 1126 290 Q 1130 290 1130 294 L 1130 416 Q 1130 420 1126 420 Q 885.0 420.7 644 420 Q 640 420 640 416 L 640 294 Q 640 290 644 290" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="885.0" y="346.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">VFS / FUSE → FuseDaemon</tspan>
<tspan x="885.0" dy="34.0">路径策略 / 脱敏 / 转码</tspan>
</text>
<path d="M 184 560 Q 600.0 559.9 1016 560 Q 1020 560 1020 564 L 1020 696 Q 1020 700 1016 700 Q 600.0 699.7 184 700 Q 180 700 180 696 L 180 564 Q 180 560 184 560" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="621.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">底层文件与媒体数据</tspan>
<tspan x="600.0" dy="34.0">URI 打开返回的 fd 也可能经 FUSE</tspan>
</text>
</svg>
