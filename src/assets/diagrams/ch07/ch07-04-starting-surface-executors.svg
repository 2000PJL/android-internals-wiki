<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">起始 Surface 的创建与移除执行器</title>
<desc id="desc">区分Shell协调与splashscreen创建移除工作 创建和移除是不同事件，图不规定与App首buffer/实际present的固定先后。 独立提交observer状态；独立提交创建工作；按类型分支</desc>
