<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">doFrame、DrawFrame 与帧完成边界</title>
<desc id="desc">区分回调顺序与异步渲染、显示完成。 上层框是回调类型顺序；下层是调查对象关系，不强制每帧执行相同工作。 Traversal承载视图遍历；HWUI在遍历路径与RenderThread协作；遍历结束不等于实际显示；异步渲染端点另行核验</desc>
