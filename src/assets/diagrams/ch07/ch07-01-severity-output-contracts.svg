<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">先确认严重度来自哪个接口</title>
<desc id="desc">将legacy getter与trace score输出区分。 仅对应固定r1内这两个接口；不要据此断言所有Android API或dump都使用同一字段。 旧路径保存legacy类型；score路径保存加权结果；getter读取legacy类型；trace写入加权类型和score</desc>
