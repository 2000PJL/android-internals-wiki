<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="853" viewBox="0 0 1200 853" role="img" aria-labelledby="title desc">
<title id="title">TTFT 与 TPOT 的计时边界</title>
<desc id="desc">把用户侧首 token 等待和后续平均间隔分开。 模型创建与分词若在 t_request 前完成就不计入 TTFT；末token与done不是同一端点。轨道不按实测比例。 进入到首token；持续生成后续token</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="853" fill="white"/>
<path d="M 375 110 L 445 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 435 104 L 445 110 L 435 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 755 110 L 825 110" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 815 104 L 825 110 L 815 116" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 69 50 Q 220.0 49.8 371 50 Q 375 50 375 54 L 375 166 Q 375 170 371 170 Q 220.0 169.5 69 170 Q 65 170 65 166 L 65 54 Q 65 50 69 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="220.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="220.0" dy="0">t_request</tspan>
<tspan x="220.0" dy="34.0">进入推理 API</tspan>
</text>
<path d="M 449 50 Q 600.0 50.3 751 50 Q 755 50 755 54 L 755 166 Q 755 170 751 170 Q 600.0 170.4 449 170 Q 445 170 445 166 L 445 54 Q 445 50 449 50" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">t_first_token</tspan>
<tspan x="600.0" dy="34.0">首 token 交付</tspan>
</text>
<path d="M 829 50 Q 980.0 49.9 1131 50 Q 1135 50 1135 54 L 1135 166 Q 1135 170 1131 170 Q 980.0 170.7 829 170 Q 825 170 825 166 L 825 54 Q 825 50 829 50" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="980.0" y="101.5" text-anchor="middle" style="font-size:25px">
<tspan x="980.0" dy="0">t_last_token</tspan>
<tspan x="980.0" dy="34.0">最后 token 交付</tspan>
</text>
<path d="M 74 653 Q 600.0 653.7 1126 653 Q 1130 653 1130 657 L 1130 789 Q 1130 793 1126 793 Q 600.0 792.4 74 793 Q 70 793 70 789 L 70 657 Q 70 653 74 653" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="714.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">TTFT = 首 token − 请求进入</tspan>
<tspan x="600.0" dy="34.0">TPOT =（末 token − 首 token）/（N_output − 1）</tspan>
</text>
<text x="600" y="553" text-anchor="middle" style="font-size:24px">
<tspan x="600" dy="0">请求结束 / 取消 / 报错另记 t_done；不要混入最后 token 的时间点</tspan>
</text>
<text x="206" y="296" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">TTFT</tspan>
</text>
<path d="M 220 312 H 1050" stroke="#777777" stroke-width="1.5"/>
<path d="M 224 273 Q 410.0 272.8 596 273 Q 600 273 600 277 L 600 306 Q 600 310 596 310 Q 410.0 310.6 224 310 Q 220 310 220 306 L 220 277 Q 220 273 224 273" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="410.0" y="299" text-anchor="middle" style="font-size:21px">
<tspan x="410.0" dy="0">API 内等待与准备</tspan>
</text>
<text x="206" y="406" text-anchor="end" style="font-size:23px">
<tspan x="206" dy="0">输出</tspan>
</text>
<path d="M 220 422 H 1050" stroke="#777777" stroke-width="1.5"/>
<path d="M 604 383 Q 790.0 383.0 976 383 Q 980 383 980 387 L 980 416 Q 980 420 976 420 Q 790.0 419.5 604 420 Q 600 420 600 416 L 600 387 Q 600 383 604 383" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="790.0" y="409" text-anchor="middle" style="font-size:21px">
<tspan x="790.0" dy="0">相邻 token 间隔</tspan>
</text>
</svg>
