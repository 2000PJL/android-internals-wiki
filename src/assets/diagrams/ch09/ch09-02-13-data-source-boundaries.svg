<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">atrace、Track Event 和 Android log 分别采集</title>
<desc id="desc">atrace、Track Event 和 Android log 分别采集：搜不到 am_anr 或 ANR Detected，先查来源、开关和覆盖；缺失记录不是没有发生的证明。 搜不到 am_anr 或 ANR Detected，先查来源、开关和覆盖；缺失记录不是没有发生的证明。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 80 Q 210.0 80.2 371 80 Q 375 80 375 84 L 375 316 Q 375 320 371 320 Q 210.0 320.5 49 320 Q 45 320 45 316 L 45 84 Q 45 80 49 80" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">linux.ftrace</tspan>
<tspan x="210.0" dy="28.560000000000002">sched / Binder / block</tspan>
<tspan x="210.0" dy="28.560000000000002">atrace print / trace_marker</tspan>
<tspan x="210.0" dy="28.560000000000002">应用Trace也走此路径</tspan>
</text>
<path d="M 439 80 Q 600.0 79.3 761 80 Q 765 80 765 84 L 765 316 Q 765 320 761 320 Q 600.0 320.1 439 320 Q 435 320 435 316 L 435 84 Q 435 80 439 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">track_event</tspan>
<tspan x="600.0" dy="28.560000000000002">Perfetto SDK事件</tspan>
<tspan x="600.0" dy="28.560000000000002">例如 debug.anr instant</tspan>
<tspan x="600.0" dy="28.560000000000002">需category与producer支持</tspan>
</text>
<path d="M 829 80 Q 990.0 80.5 1151 80 Q 1155 80 1155 84 L 1155 316 Q 1155 320 1151 320 Q 990.0 319.8 829 320 Q 825 320 825 316 L 825 84 Q 825 80 829 80" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">android.log 等</tspan>
<tspan x="990.0" dy="28.560000000000002">EventLog / logcat</tspan>
<tspan x="990.0" dy="28.560000000000002">process_stats给身份映射</tspan>
<tspan x="990.0" dy="28.560000000000002">资源数据源按需配置</tspan>
</text>
</svg>
