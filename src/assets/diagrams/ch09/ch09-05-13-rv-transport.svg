<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">发布端：包与layout ID、actions</tspan>
<tspan x="600.0" dy="34.0">bitmap / collection cache</tspan>
</text>
<path d="M 104 200 Q 600.0 200.3 1096 200 Q 1100 200 1100 204 L 1100 296 Q 1100 300 1096 300 Q 600.0 299.9 104 300 Q 100 300 100 296 L 100 204 Q 100 200 104 200" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="241.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Parcel：缓存、布局字段、action count</tspan>
<tspan x="600.0" dy="34.0">逐个action tag及数据</tspan>
</text>
<path d="M 104 355 Q 600.0 354.5 1096 355 Q 1100 355 1100 359 L 1100 451 Q 1100 455 1096 455 Q 600.0 455.1 104 455 Q 100 455 100 451 L 100 359 Q 100 355 104 355" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="396.5" text-anchor="middle" style="font-size:25px">
