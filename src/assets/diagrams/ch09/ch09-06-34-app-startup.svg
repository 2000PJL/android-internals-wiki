<text x="600.0" y="86.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">InitializationProvider.onCreate</tspan>
<tspan x="600.0" dy="34.0">applicationContext可用的常见路径</tspan>
</text>
<path d="M 104 200 Q 600.0 200.6 1096 200 Q 1100 200 1100 204 L 1100 296 Q 1100 300 1096 300 Q 600.0 300.6 104 300 Q 100 300 100 296 L 100 204 Q 100 200 104 200" fill="white" stroke="#4A90D9" stroke-width="3"/>
