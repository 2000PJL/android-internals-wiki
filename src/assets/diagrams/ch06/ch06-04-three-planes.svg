<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">共享存储的三个职责层</title>
<desc id="desc">把会话建立、文件数据路径和媒体索引分开归因。 职责分层示意；不是每次read都要重新执行挂载或数据库查询。 挂载建立后才能服务该会话文件请求；文件请求关联媒体策略与索引</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
