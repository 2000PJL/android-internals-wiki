<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">category、tracepoint 与解析表属于不同层</title>
<desc id="desc">category、tracepoint 与解析表属于不同层：没有 block atrace category；旧binder_lock事件也不能从category存在推断当前6.18内核必定提供。 没有 block atrace category；旧binder_lock事件也不能从category存在推断当前6.18内核必定提供。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 80 Q 210.0 80.4 371 80 Q 375 80 375 84 L 375 316 Q 375 320 371 320 Q 210.0 320.6 49 320 Q 45 320 45 316 L 45 84 Q 45 80 49 80" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">atrace category</tspan>
<tspan x="210.0" dy="28.560000000000002">sched / freq / disk</tspan>
<tspan x="210.0" dy="28.560000000000002">binder_driver / memreclaim</tspan>
<tspan x="210.0" dy="28.560000000000002">由atrace.cpp映射</tspan>
</text>
<path d="M 439 80 Q 600.0 80.2 761 80 Q 765 80 765 84 L 765 316 Q 765 320 761 320 Q 600.0 320.6 439 320 Q 435 320 435 316 L 435 84 Q 435 80 439 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">ftrace event</tspan>
<tspan x="600.0" dy="28.560000000000002">sched/sched_switch</tspan>
<tspan x="600.0" dy="28.560000000000002">block/block_rq_issue等</tspan>
<tspan x="600.0" dy="28.560000000000002">先检查目标内核是否暴露</tspan>
</text>
<path d="M 829 80 Q 990.0 79.9 1151 80 Q 1155 80 1155 84 L 1155 316 Q 1155 320 1151 320 Q 990.0 320.4 829 320 Q 825 320 825 316 L 825 84 Q 825 80 829 80" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">Perfetto解析表</tspan>
<tspan x="990.0" dy="28.560000000000002">sched / thread_state</tspan>
<tspan x="990.0" dy="28.560000000000002">slice / flow / args</tspan>
<tspan x="990.0" dy="28.560000000000002">字段取决于事件与解析器</tspan>
</text>
</svg>
