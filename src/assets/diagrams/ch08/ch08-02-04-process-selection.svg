<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">startSpecificActivity()</tspan>
<tspan x="600.0" dy="34.0">检查目标进程及可用应用线程</tspan>
</text>
<path d="M 54 290 Q 315.0 289.6 576 290 Q 580 290 580 294 L 580 456 Q 580 460 576 460 Q 315.0 459.6 54 460 Q 50 460 50 456 L 50 294 Q 50 290 54 290" fill="white" stroke="#5BA4CF" stroke-width="3"/>
