<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">ExpiredTimer 在输入路径只承载数据</title>
<desc id="desc">ExpiredTimer 在输入路径只承载数据：输入deadline由Native状态与AnrTracker驱动；AnrInfo是否存在还取决于flag及后续有效记录。 输入deadline由Native状态与AnrTracker驱动；AnrInfo是否存在还取决于flag及后续有效记录。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 70.0 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 315.3 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">mTimerId</tspan>
<tspan x="210.0" dy="28.560000000000002">输入event id</tspan>
<tspan x="210.0" dy="28.560000000000002">不代表Java启动native timer</tspan>
<tspan x="210.0" dy="28.560000000000002">用于后续AnrInfo关联</tspan>
</text>
<path d="M 439 70 Q 600.0 69.9 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 314.6 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">mStartMs</tspan>
<tspan x="600.0" dy="28.560000000000002">原始输入eventTime</tspan>
<tspan x="600.0" dy="28.560000000000002">纳秒转毫秒</tspan>
<tspan x="600.0" dy="28.560000000000002">不是一概等于等待起点</tspan>
</text>
<path d="M 829 70 Q 990.0 70.6 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.4 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="142.51999999999998" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">mDurationMs</tspan>
<tspan x="990.0" dy="28.560000000000002">no-focus用配置timeout</tspan>
<tspan x="990.0" dy="28.560000000000002">window用最老entry</tspan>
<tspan x="990.0" dy="28.560000000000002">delivery至检查的等待</tspan>
<tspan x="990.0" dy="28.560000000000002">具体算法各不相同</tspan>
</text>
</svg>
