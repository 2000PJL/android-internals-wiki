<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">硬件 operation 可在 init 阶段创建</title>
<desc id="desc">硬件 operation 可在 init 阶段创建：成功的硬件 Cipher init、Signature initSign、Mac init 可创建 operation；仅测 finish 会漏掉 begin。 成功的硬件 Cipher init、Signature initSign、Mac init 可创建 operation；仅测 finish 会漏掉 begin。 按标注条件进入下一阶段；按标注条件进入下一阶段；按标注条件进入下一阶段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="780" fill="white"/>
<path d="M 600 160 L 600 220" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 210 L 600 220 L 606 210" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 340 L 600 400" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 390 L 600 400 L 606 390" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 520 L 600 580" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 570 L 600 580 L 606 570" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 104 40 Q 600.0 40.5 1096 40 Q 1100 40 1100 44 L 1100 156 Q 1100 160 1096 160 Q 600.0 160.7 104 160 Q 100 160 100 156 L 100 44 Q 100 40 104 40" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">JCA Cipher.init / Signature.initSign / Mac.init</tspan>
<tspan x="600.0" dy="34.0">这些入口不只是给 Java 对象赋值</tspan>
</text>
<path d="M 104 220 Q 600.0 219.5 1096 220 Q 1100 220 1100 224 L 1100 336 Q 1100 340 1096 340 Q 600.0 339.3 104 340 Q 100 340 100 336 L 100 224 Q 100 220 104 220" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="271.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Provider.ensureKeystoreOperationInitialized</tspan>
<tspan x="600.0" dy="34.0">KeyStoreSecurityLevel.createOperation</tspan>
</text>
<path d="M 104 400 Q 600.0 399.2 1096 400 Q 1100 400 1100 404 L 1100 516 Q 1100 520 1096 520 Q 600.0 519.4 104 520 Q 100 520 100 516 L 100 404 Q 100 400 104 400" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="451.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">keystore2 → IKeyMintDevice.begin</tspan>
<tspan x="600.0" dy="34.0">创建后端状态并返回 operation</tspan>
</text>
<path d="M 104 580 Q 600.0 579.8 1096 580 Q 1100 580 1100 584 L 1100 696 Q 1100 700 1096 700 Q 600.0 700.8 104 700 Q 100 700 100 696 L 100 584 Q 100 580 104 580" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="631.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">init 成功到 finish / abort / prune 之间</tspan>
<tspan x="600.0" dy="34.0">operation 占用资源；公钥 verify 不套用这条私钥路径</tspan>
</text>
</svg>
