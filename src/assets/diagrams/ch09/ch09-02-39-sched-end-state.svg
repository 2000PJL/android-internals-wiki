<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">sched 行是运行区间，end_state 说明离开 CPU 后状态</title>
<desc id="desc">sched 行是运行区间，end_state 说明离开 CPU 后状态：不要用sched的行时长累加成Sleeping；等待时长应查thread_state并处理观察边界。 不要用sched的行时长累加成Sleeping；等待时长应查thread_state并处理观察边界。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 80 Q 210.0 80.6 371 80 Q 375 80 375 84 L 375 316 Q 375 320 371 320 Q 210.0 319.7 49 320 Q 45 320 45 316 L 45 84 Q 45 80 49 80" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">sched.ts / dur</tspan>
<tspan x="210.0" dy="28.560000000000002">当前这段就在CPU上</tspan>
<tspan x="210.0" dy="28.560000000000002">对应thread_state Running</tspan>
<tspan x="210.0" dy="28.560000000000002">由utid关联线程</tspan>
</text>
<path d="M 439 80 Q 600.0 79.7 761 80 Q 765 80 765 84 L 765 316 Q 765 320 761 320 Q 600.0 320.4 439 320 Q 435 320 435 316 L 435 84 Q 435 80 439 80" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">sched.end_state</tspan>
<tspan x="600.0" dy="28.560000000000002">R / R+ / S / D等</tspan>
<tspan x="600.0" dy="28.560000000000002">描述运行段结束后的状态</tspan>
<tspan x="600.0" dy="28.560000000000002">不是本行又睡又运行</tspan>
</text>
<path d="M 829 80 Q 990.0 79.6 1151 80 Q 1155 80 1155 84 L 1155 316 Q 1155 320 1151 320 Q 990.0 320.0 829 320 Q 825 320 825 316 L 825 84 Q 825 80 829 80" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="164.3" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">thread_state</tspan>
<tspan x="990.0" dy="28.560000000000002">给出运行与各种等待区间</tspan>
<tspan x="990.0" dy="28.560000000000002">dur=-1尚未闭合</tspan>
<tspan x="990.0" dy="28.560000000000002">NULL结束状态保留未知</tspan>
</text>
</svg>
