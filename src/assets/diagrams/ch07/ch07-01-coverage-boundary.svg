</text>
<path d="M 154 290 Q 600.0 290.3 1046 290 Q 1050 290 1050 294 L 1050 436 Q 1050 440 1046 440 Q 600.0 439.9 154 440 Q 150 440 150 436 L 150 294 Q 150 290 154 290" fill="white" stroke="#4A90D9" stroke-width="3"/>
