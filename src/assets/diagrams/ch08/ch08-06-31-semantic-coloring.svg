<title id="title">语义颜色表达状态，不改变传输或限流</title>
<desc id="desc">语义颜色表达状态，不改变传输或限流：API 37 的语义色让系统按含义展示状态；它不降低图片成本，也不增加 FCM、NMS 或渲染预算。 API 37 的语义色让系统按含义展示状态；它不降低图片成本，也不增加 FCM、NMS 或渲染预算。 </desc>
