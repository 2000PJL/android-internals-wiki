<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">SurfaceView 与 TextureView 的合成对象</title>
<desc id="desc">把App内部纹理采样与SF独立Layer区分 职责示意，省略SurfaceControl层级中间节点；不保证SurfaceView一定overlay。 独立Surface进入SF；宿主先采样外部内容</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="990" fill="white"/>
<path d="M 312 200 L 312 385" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 306 375 L 312 385 L 318 375" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 887 200 L 887 385" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 881 375 L 887 385 L 893 375" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 54 65 Q 312.5 64.8 571 65 Q 575 65 575 69 L 575 196 Q 575 200 571 200 Q 312.5 199.7 54 200 Q 50 200 50 196 L 50 69 Q 50 65 54 65" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="124.0" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">SurfaceView</tspan>
<tspan x="312.5" dy="34.0">宿主窗口 + 独立视频 / 相机 Surface</tspan>
</text>
<path d="M 629 65 Q 887.5 65.1 1146 65 Q 1150 65 1150 69 L 1150 196 Q 1150 200 1146 200 Q 887.5 199.9 629 200 Q 625 200 625 196 L 625 69 Q 625 65 629 65" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="887.5" y="124.0" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">TextureView</tspan>
<tspan x="887.5" dy="34.0">外部内容纹理进入宿主 HWUI</tspan>
</text>
<path d="M 54 385 Q 312.5 385.6 571 385 Q 575 385 575 389 L 575 526 Q 575 530 571 530 Q 312.5 530.0 54 530 Q 50 530 50 526 L 50 389 Q 50 385 54 385" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="312.5" y="449.0" text-anchor="middle" style="font-size:25px">
<tspan x="312.5" dy="0">SurfaceFlinger：多个独立 Layer</tspan>
<tspan x="312.5" dy="34.0">HWC 可按独立 Layer 协商</tspan>
</text>
<path d="M 629 385 Q 887.5 384.8 1146 385 Q 1150 385 1150 389 L 1150 526 Q 1150 530 1146 530 Q 887.5 529.3 629 530 Q 625 530 625 526 L 625 389 Q 625 385 629 385" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="887.5" y="449.0" text-anchor="middle" style="font-size:25px">
<tspan x="887.5" dy="0">SurfaceFlinger：宿主 Window buffer</tspan>
<tspan x="887.5" dy="34.0">视频矩形已并入宿主内容</tspan>
</text>
<path d="M 144 800 Q 600.0 800.4 1056 800 Q 1060 800 1060 804 L 1060 936 Q 1060 940 1056 940 Q 600.0 939.6 144 940 Q 140 940 140 936 L 140 804 Q 140 800 144 800" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="861.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">独立 Layer 提供 device composition 的机会</tspan>
<tspan x="600.0" dy="34.0">宿主 DEVICE 不代表内部视频独占物理 plane</tspan>
</text>
</svg>
