<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Resources 包装层与共享实现</title>
<desc id="desc">展示多资源包装对象可复用实现，资源键差异才可能分叉。 概念对象关系；不把弱引用缓存视为对象必然存活证据，也不承诺所有包装对象共享同一实现。 Resources A 引用共享实现。；Resources B 也可以引用同一实现。；缓存按键以弱引用关联实现，不强制延长其生命周期。；实现通过 AssetManager 访问 APK 资源。</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
