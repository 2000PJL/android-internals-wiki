<text x="600.0" y="103.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">启用warning参数 → 加入50% split point</tspan>
</text>
<path d="M 104 200 Q 600.0 199.9 1096 200 Q 1100 200 1100 204 L 1100 296 Q 1100 300 1096 300 Q 600.0 300.8 104 300 Q 100 300 100 296 L 100 204 Q 100 200 104 200" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="241.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">native在该计时起点与timeout上安排split</tspan>
<tspan x="600.0" dy="34.0">回报timerId与已消耗时长</tspan>
</text>
<path d="M 104 355 Q 600.0 354.8 1096 355 Q 1100 355 1100 359 L 1100 451 Q 1100 455 1096 455 Q 600.0 454.5 104 455 Q 100 455 100 451 L 100 359 Q 100 355 104 355" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="413.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Java查timerArg；messageId有效且对象仍存在才发Handler消息</tspan>
</text>
<path d="M 104 510 Q 600.0 509.7 1096 510 Q 1100 510 1100 514 L 1100 606 Q 1100 610 1096 610 Q 600.0 610.0 104 610 Q 100 610 100 606 L 100 514 Q 100 510 104 510" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="551.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">ActiveServices按有效状态填type/timeout/description</tspan>
<tspan x="600.0" dy="34.0">AMS按UID投递</tspan>
</text>
</svg>
