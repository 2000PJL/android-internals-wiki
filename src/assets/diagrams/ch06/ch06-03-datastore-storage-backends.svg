<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">1.2.1 的 FileStorage 与 OkioStorage 入口</title>
<desc id="desc">避免把一个后端的具体文件同步实现泛化到所有DataStore调用。 明确锁定1.2.1具体重载与默认委托；自定义Storage、其他平台或版本需另查，不能把类名当作统一平台实现。 Preferences默认选择FileStorage；serializer文件工厂选择FileStorage；typed委托选择OkioStorage；FileStorage接入共同存储抽象；OkioStorage也接入存储抽象</desc>
