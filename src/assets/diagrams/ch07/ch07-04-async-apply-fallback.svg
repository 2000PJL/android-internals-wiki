<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">异步 apply 失败后的同步回退</title>
<desc id="desc">把worker失败与UI同步重试的成本位置分开 不是所有异常都由自定义RemoteViews导致；View校验失败和任务取消还有各自错误路径。 异步成功；异步错误回调；同步结果进一步处理</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="940" fill="white"/>
<path d="M 600 155 L 600 235 L 315 235 L 315 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 320 L 315 330 L 321 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 155 L 600 235 L 885 235 L 885 330" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 320 L 885 330 L 891 320" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 480 L 885 600 L 600 600 L 600 700" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 690 L 600 700 L 606 690" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 45.4 1046 45 Q 1050 45 1050 49 L 1050 151 Q 1050 155 1046 155 Q 600.0 154.3 154 155 Q 150 155 150 151 L 150 49 Q 150 45 154 45" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="108.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">RemoteViews 异步准备 / Action 应用</tspan>
</text>
<path d="M 64 330 Q 315.0 329.2 566 330 Q 570 330 570 334 L 570 476 Q 570 480 566 480 Q 315.0 480.2 64 480 Q 60 480 60 476 L 60 334 Q 60 330 64 330" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="315.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">成功：onViewApplied</tspan>
<tspan x="315.0" dy="34.0">校验 View / 更新 wrapper / 内容结果</tspan>
</text>
<path d="M 634 330 Q 885.0 330.1 1136 330 Q 1140 330 1140 334 L 1140 476 Q 1140 480 1136 480 Q 885.0 479.9 634 480 Q 630 480 630 476 L 630 334 Q 630 330 634 330" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="885.0" y="396.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">失败：onError</tspan>
<tspan x="885.0" dy="34.0">在 UI 回调中同步 apply / reapply</tspan>
</text>
<path d="M 214 700 Q 600.0 699.3 986 700 Q 990 700 990 704 L 990 836 Q 990 840 986 840 Q 600.0 839.8 214 840 Q 210 840 210 836 L 210 704 Q 210 700 214 700" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="761.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">同步重试结果</tspan>
<tspan x="600.0" dy="34.0">成功回到完成处理；失败取消 / 上报绑定异常</tspan>
</text>
<rect x="284.0" y="240.0" width="62.0" height="36.3" fill="white"/>
<text x="315" y="265" text-anchor="middle" style="font-size:23px">
<tspan x="315" dy="0">成功</tspan>
</text>
<rect x="854.0" y="240.0" width="62.0" height="36.3" fill="white"/>
<text x="885" y="265" text-anchor="middle" style="font-size:23px">
<tspan x="885" dy="0">失败</tspan>
</text>
</svg>
