<title id="title">先识别像素生产者与图层</title>
<desc id="desc">避免只盯HWUI主线程漏掉独立Surface。 分类用于找到证据入口，不声称某个框架只存在一种Surface组织方式。 HWUI内容映射到目标layer；独立producer映射到目标layer；在layer身份确定后判断合成方式</desc>
