<tspan x="210.0" dy="0">Launcher 等宿主</tspan>
<tspan x="210.0" dy="34.0">显示 RemoteViews</tspan>
<tspan x="210.0" dy="34.0">点击已绑定动作</tspan>
</text>
<path d="M 439 90 Q 600.0 89.5 761 90 Q 765 90 765 94 L 765 276 Q 765 280 761 280 Q 600.0 280.1 439 280 Q 435 280 435 276 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="159.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">PendingIntent 身份</tspan>
<tspan x="600.0" dy="34.0">requestCode + data</tspan>
<tspan x="600.0" dy="34.0">简单页面入口 immutable</tspan>
</text>
