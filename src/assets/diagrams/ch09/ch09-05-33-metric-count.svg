<tspan x="990.0" dy="28.560000000000002">列表可含更多项</tspan>
<tspan x="990.0" dy="28.560000000000002">展开只绑定前三个</tspan>
<tspan x="990.0" dy="28.560000000000002">构造前限制可见列表</tspan>
</text>
</svg>
