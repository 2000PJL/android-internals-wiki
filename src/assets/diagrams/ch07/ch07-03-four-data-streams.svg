<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">从模型到实际显示的四组记录</title>
<desc id="desc">为轨迹测量保留评估时刻、模型、View消费和真实帧结果。 四组记录的关联顺序，不保证每个UI样本都独立产生buffer或被显示；丢弃/复用结果需保留。 记录模型采用哪一个评估时间；比较模型输出与View实际消费；关联到真实被呈现的buffer和显示帧</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1200" fill="white"/>
<path d="M 600 185 L 600 350" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 340 L 600 350 L 606 340" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 490 L 600 655" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 645 L 600 655 L 606 645" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 800 L 600 970" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 960 L 600 970 L 606 960" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.3 1046 45 Q 1050 45 1050 49 L 1050 181 Q 1050 185 1046 185 Q 600.0 185.3 154 185 Q 150 185 150 181 L 150 49 Q 150 45 154 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="600.0" y="106.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">时间与帧计划</tspan>
<tspan x="600.0" dy="34.0">frameTime / t_eval / expected present / deadline</tspan>
</text>
<path d="M 154 350 Q 600.0 349.6 1046 350 Q 1050 350 1050 354 L 1050 486 Q 1050 490 1046 490 Q 600.0 490.2 154 490 Q 150 490 150 486 L 150 354 Q 150 350 154 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="411.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">模型输出</tspan>
<tspan x="600.0" dy="34.0">scroller 位置 / 动画 progress / 目标 transform</tspan>
</text>
<path d="M 154 655 Q 600.0 655.5 1046 655 Q 1050 655 1050 659 L 1050 796 Q 1050 800 1046 800 Q 600.0 799.2 154 800 Q 150 800 150 796 L 150 659 Q 150 655 154 655" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="719.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">View 消费结果</tspan>
<tspan x="600.0" dy="34.0">累计 dx-dy / 稳定条目坐标 / 实际应用的状态</tspan>
</text>
<path d="M 154 970 Q 600.0 969.7 1046 970 Q 1050 970 1050 974 L 1050 1111 Q 1050 1115 1046 1115 Q 600.0 1115.5 154 1115 Q 150 1115 150 1111 L 150 974 Q 150 970 154 970" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="1034.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">实际帧与显示关联</tspan>
<tspan x="600.0" dy="34.0">SurfaceFrame / layer / buffer → DisplayFrame / present</tspan>
</text>
</svg>
