<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">CIG 内的 CIS 与关联 ACL</title>
<desc id="desc">区分同步分组、逐设备等时流与基础连接。 图仅画下行媒体方向；CIS也可双向，CIG不要求恰好两个CIS。 为左耳发送音频；为右耳发送音频；左耳接收CIS；右耳接收CIS</desc>
