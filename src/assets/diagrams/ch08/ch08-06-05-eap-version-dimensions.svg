<title id="title">AndroidConfigV2 目前是 EAP 独立配置维度</title>
<desc id="desc">AndroidConfigV2 目前是 EAP 独立配置维度：android_v2 配置、SDK EAP 与 Play services 支持共同决定路径；messages:send 名称或 Android 17 不证明已经迁移。 android_v2 配置、SDK EAP 与 Play services 支持共同决定路径；messages:send 名称或 Android 17 不证明已经迁移。 </desc>
