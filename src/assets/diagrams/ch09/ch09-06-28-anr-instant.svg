<tspan x="990.0" dy="28.560000000000002">同一身份与时间</tspan>
<tspan x="990.0" dy="28.560000000000002">报告的原始reason</tspan>
<tspan x="990.0" dy="28.560000000000002">确认ContentProvider路径</tspan>
</text>
