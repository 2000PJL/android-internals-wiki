<tspan x="600.0" dy="34.0">按请求执行文件访问与策略</tspan>
</text>
<path d="M 154 500 Q 600.0 500.7 1046 500 Q 1050 500 1050 504 L 1050 616 Q 1050 620 1046 620 Q 600.0 620.3 154 620 Q 150 620 150 616 L 150 504 Q 150 500 154 500" fill="white" stroke="#4CAF50" stroke-width="3"/>
