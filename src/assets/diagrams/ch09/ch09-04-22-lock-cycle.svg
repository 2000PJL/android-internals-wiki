<title id="title">两把锁的持有边与等待边</title>
<desc id="desc">两把锁的持有边与等待边：教学构造：实线箭头按“申请者→锁→持有者”连接，形成main与worker互等；地址、线程和日志均非真实线上样本。 教学构造：实线箭头按“申请者→锁→持有者”连接，形成main与worker互等；地址、线程和日志均非真实线上样本。 main申请DatabaseHelper；DatabaseHelper被worker持有；worker申请DataManager；DataManager被main持有</desc>
