<title id="title">authenticationType 的分辨力止于认证类型</title>
<desc id="desc">authenticationType 的分辨力止于认证类型：公开结果区分 biometric、device credential 或 unknown；不能据此上报具体传感器或本次识别强度。 公开结果区分 biometric、device credential 或 unknown；不能据此上报具体传感器或本次识别强度。 </desc>
