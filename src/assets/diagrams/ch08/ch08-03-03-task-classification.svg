<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">按目标终点划分初始化任务</title>
<desc id="desc">按目标终点划分初始化任务：同一 SDK 可因入口不同而改变前置要求；TTFD 工作可与首帧准备并行。 同一 SDK 可因入口不同而改变前置要求；TTFD 工作可与首帧准备并行。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 100.2 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 309.8 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">TTID 必需</tspan>
<tspan x="210.0" dy="34.0">缺少就无法提交稳定首帧</tspan>
<tspan x="210.0" dy="34.0">保留依赖并缩短成本</tspan>
</text>
<path d="M 439 100 Q 600.0 100.0 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.8 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">TTFD 必需</tspan>
<tspan x="600.0" dy="34.0">主内容 / 交互依赖结果</tspan>
<tspan x="600.0" dy="34.0">可与首帧工作并行</tspan>
</text>
<path d="M 829 100 Q 990.0 99.7 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 309.7 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">当前入口不需要</tspan>
<tspan x="990.0" dy="34.0">未进入功能可不执行</tspan>
<tspan x="990.0" dy="34.0">条件触发或按需初始化</tspan>
</text>
</svg>
