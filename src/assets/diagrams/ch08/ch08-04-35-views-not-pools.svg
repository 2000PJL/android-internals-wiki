<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">共享视图限制执行而不新增专用线程池</title>
<desc id="desc">共享视图限制执行而不新增专用线程池：Default 视图控制 CPU 执行，IO 视图控制阻塞片段；挂起后仍在途的请求需另有限额。 Default 视图控制 CPU 执行，IO 视图控制阻塞片段；挂起后仍在途的请求需另有限额。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="400" fill="white"/>
<path d="M 49 100 Q 210.0 100.7 371 100 Q 375 100 375 104 L 375 306 Q 375 310 371 310 Q 210.0 309.9 49 310 Q 45 310 45 306 L 45 104 Q 45 100 49 100" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="162.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">Default</tspan>
<tspan x="210.0" dy="34.0">limitedParallelism(2)</tspan>
<tspan x="210.0" dy="34.0">最多两个执行片段</tspan>
<tspan x="210.0" dy="34.0">不承诺独占两个 worker</tspan>
</text>
<path d="M 439 100 Q 600.0 100.6 761 100 Q 765 100 765 104 L 765 306 Q 765 310 761 310 Q 600.0 310.8 439 310 Q 435 310 435 306 L 435 104 Q 435 100 439 100" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">IO.limitedParallelism(4)</tspan>
<tspan x="600.0" dy="34.0">最多四个执行片段</tspan>
<tspan x="600.0" dy="34.0">计入进程阻塞总预算</tspan>
</text>
<path d="M 829 100 Q 990.0 100.1 1151 100 Q 1155 100 1155 104 L 1155 306 Q 1155 310 1151 310 Q 990.0 309.7 829 310 Q 825 310 825 306 L 825 104 Q 825 100 829 100" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="179.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">挂起 / 异步 SDK</tspan>
<tspan x="990.0" dy="34.0">片段结束仍可能有请求在途</tspan>
<tspan x="990.0" dy="34.0">用许可或业务队列约束</tspan>
</text>
</svg>
