<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">MetricStyle 的数量边界</title>
<desc id="desc">MetricStyle 的数量边界：最多三项说的是展开布局；不要扩大为所有surface都只读取前三个，critical metric另有选择逻辑。 最多三项说的是展开布局；不要扩大为所有surface都只读取前三个，critical metric另有选择逻辑。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 70.6 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 315.6 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">零个metric</tspan>
<tspan x="210.0" dy="28.560000000000002">validate时拒绝</tspan>
<tspan x="210.0" dy="28.560000000000002">build抛参数异常</tspan>
<tspan x="210.0" dy="28.560000000000002">先准备至少一个</tspan>
</text>
<path d="M 439 70 Q 600.0 70.7 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 315.6 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">一个到三个</tspan>
<tspan x="600.0" dy="28.560000000000002">每项label + MetricValue</tspan>
<tspan x="600.0" dy="28.560000000000002">展开布局最多绑定三个</tspan>
<tspan x="600.0" dy="28.560000000000002">API37守卫后使用</tspan>
</text>
<path d="M 829 70 Q 990.0 69.7 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.5 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="156.8" text-anchor="middle" style="font-size:21px">
