<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">ASE 首次启动的典型状态链</title>
<desc id="desc">呈现首次建流的状态顺序并保留方向相关握手边界。 图不覆盖重配置、失败回退、链路丢失与所有合法捷径；状态不直接对应固定毫秒数。 依次进入下一阶段；依次进入下一阶段；依次进入下一阶段；依次进入下一阶段</desc>
