<title id="title">四个固定参数的关系</title>
<desc id="desc">四个固定参数的关系：参数的加法关系不等于一次调用必串行等待这些阶段；实际返回或处理不保证恰在参数时长发生。 参数的加法关系不等于一次调用必串行等待这些阶段；实际返回或处理不保证恰在参数时长发生。 </desc>
