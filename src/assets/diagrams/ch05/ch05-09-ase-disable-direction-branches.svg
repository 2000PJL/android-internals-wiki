<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1143" viewBox="0 0 1200 1143" role="img" aria-labelledby="title desc">
<title id="title">ASE 停止必须按 Sink 与 Source 分支</title>
<desc id="desc">避免把Disabling画成两个方向必经状态。 只画成功停止；失败与自主状态变化另看通知。Source中的接收方是客户端，不能把Receiver Stop Ready画成音频源发送。 Sink接受Disable直接回QoS；Source接受Disable进入Disabling；接收端准备停止消费音频；接受Receiver Stop Ready完成停止</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1143" fill="white"/>
<path d="M 350 190 L 350 272.1 L 320 272.1 L 320 423" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 314 413 L 320 423 L 326 413" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 850 190 L 850 272.1 L 880 272.1 L 880 423" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 874 413 L 880 423 L 886 413" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 880 573 L 880 673" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 874 663 L 880 673 L 886 663" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 880 823 L 880 923" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 874 913 L 880 923 L 886 913" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 124 50 Q 600.0 49.8 1076 50 Q 1080 50 1080 54 L 1080 186 Q 1080 190 1076 190 Q 600.0 190.2 124 190 Q 120 190 120 186 L 120 54 Q 120 50 124 50" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Enabling 或 Streaming 中接受 Disable</tspan>
<tspan x="600.0" dy="34.0">先按 ASE 的音频方向分支</tspan>
</text>
<path d="M 74 423 Q 320.0 422.4 566 423 Q 570 423 570 427 L 570 569 Q 570 573 566 573 Q 320.0 573.0 74 573 Q 70 573 70 569 L 70 427 Q 70 423 74 423" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="320.0" y="489.5" text-anchor="middle" style="font-size:25px">
<tspan x="320.0" dy="0">Sink ASE</tspan>
<tspan x="320.0" dy="34.0">直接回到 QoS Configured</tspan>
</text>
<path d="M 634 423 Q 880.0 423.3 1126 423 Q 1130 423 1130 427 L 1130 569 Q 1130 573 1126 573 Q 880.0 572.8 634 573 Q 630 573 630 569 L 630 427 Q 630 423 634 423" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="880.0" y="489.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">Source ASE</tspan>
<tspan x="880.0" dy="34.0">进入 Disabling</tspan>
</text>
<path d="M 634 673 Q 880.0 672.4 1126 673 Q 1130 673 1130 677 L 1130 819 Q 1130 823 1126 823 Q 880.0 823.7 634 823 Q 630 823 630 819 L 630 677 Q 630 673 634 673" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="880.0" y="739.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">客户端 Audio Sink</tspan>
<tspan x="880.0" dy="34.0">发送 Receiver Stop Ready</tspan>
</text>
<path d="M 634 923 Q 880.0 922.5 1126 923 Q 1130 923 1130 927 L 1130 1059 Q 1130 1063 1126 1063 Q 880.0 1063.1 634 1063 Q 630 1063 630 1059 L 630 927 Q 630 923 634 923" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="880.0" y="984.5" text-anchor="middle" style="font-size:25px">
<tspan x="880.0" dy="0">Source ASE</tspan>
<tspan x="880.0" dy="34.0">回到 QoS Configured</tspan>
</text>
