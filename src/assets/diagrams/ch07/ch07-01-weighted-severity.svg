<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">trace 加权严重度的判断顺序</title>
<desc id="desc">展示前置条件、mask与score阈值。 加权严重度用于该trace计算路径，不把0.9分数阈值换算成跨刷新率固定毫秒数。 r1 addSkippedFrame合成Dropped记录直接写None，不能套用本函数返回规则。 进入下一依赖阶段；进入下一依赖阶段；进入下一依赖阶段；进入下一依赖阶段</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1110" fill="white"/>
<path d="M 600 190 L 600 265" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 255 L 600 265 L 606 255" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 410 L 600 485" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 475 L 600 485 L 606 475" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 630 L 600 705" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 695 L 600 705 L 606 695" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 850 L 600 925" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 915 L 600 925 L 606 915" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.9 1046 45 Q 1050 45 1050 49 L 1050 186 Q 1050 190 1046 190 Q 600.0 190.0 154 190 Q 150 190 150 186 L 150 49 Q 150 45 154 45" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="109.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">expectedPresentDelta &lt;= 0？</tspan>
<tspan x="600.0" dy="34.0">是 → Unknown；否则继续</tspan>
</text>
<path d="M 154 265 Q 600.0 265.2 1046 265 Q 1050 265 1050 269 L 1050 406 Q 1050 410 1046 410 Q 600.0 409.6 154 410 Q 150 410 150 406 L 150 269 Q 150 265 154 265" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="329.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">参与严重度计算的 jank 位为空？</tspan>
<tspan x="600.0" dy="34.0">是 → None；否则继续</tspan>
</text>
<path d="M 154 485 Q 600.0 485.8 1046 485 Q 1050 485 1050 489 L 1050 626 Q 1050 630 1046 630 Q 600.0 630.7 154 630 Q 150 630 150 626 L 150 489 Q 150 485 154 485" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="549.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">恰好只有 Dropped？</tspan>
<tspan x="600.0" dy="34.0">是 → Unknown；否则计算 score</tspan>
</text>
<path d="M 154 705 Q 600.0 704.3 1046 705 Q 1050 705 1050 709 L 1050 846 Q 1050 850 1046 850 Q 600.0 850.5 154 850 Q 150 850 150 846 L 150 709 Q 150 705 154 705" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="769.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Δ = abs(expectedPresentDelta − actualPresentDelta)</tspan>
<tspan x="600.0" dy="34.0">score = log2(1 + Δ/T) × sqrt(T / T120Hz)</tspan>
</text>
<path d="M 154 925 Q 600.0 925.5 1046 925 Q 1050 925 1050 929 L 1050 1066 Q 1050 1070 1046 1070 Q 600.0 1070.0 154 1070 Q 150 1070 150 1066 L 150 929 Q 150 925 154 925" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="989.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">score = 0 → None；0 &lt; score &lt; 0.9 → Partial</tspan>
<tspan x="600.0" dy="34.0">score &gt;= 0.9 → Full</tspan>
</text>
<rect x="546.0" y="210.0" width="108.0" height="36.3" fill="white"/>
<text x="600" y="235" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">否则继续</tspan>
</text>
<rect x="546.0" y="430.0" width="108.0" height="36.3" fill="white"/>
<text x="600" y="455" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">否则继续</tspan>
</text>
<rect x="546.0" y="650.0" width="108.0" height="36.3" fill="white"/>
<text x="600" y="675" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">否则继续</tspan>
</text>
<rect x="520.0" y="870.0" width="160.0" height="36.3" fill="white"/>
<text x="600" y="895" text-anchor="middle" style="font-size:23px">
<tspan x="600" dy="0">按 score 定级</tspan>
</text>
</svg>
