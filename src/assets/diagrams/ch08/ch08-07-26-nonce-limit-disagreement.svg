<title id="title">nonce 的两套官方长度单位要区分</title>
<desc id="desc">nonce 的两套官方长度单位要区分：官方两处单位不同，不能互相替换来推断边界输入必过。32 字节摘要及其 43 字符编码避开两套边界。 官方两处单位不同，不能互相替换来推断边界输入必过。32 字节摘要及其 43 字符编码避开两套边界。 </desc>
