<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">Recents 中实时画面与任务快照</title>
<desc id="desc">区别HardwareBuffer采样、实时Surface和Launcher动画三条路径。 路径集合，不保证全部卡片同时使用live与snapshot；HardwareBuffer采样不等于图片文件解码。 任务实时surface参与过渡；部分卡片使用任务快照；按现场参与者验证整屏结果</desc>
