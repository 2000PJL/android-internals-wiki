<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc">
<title id="title">最小配置覆盖哪些信号</title>
<desc id="desc">最小配置覆盖哪些信号：类别展开与权限受目标系统影响；配置通过解析不证明设备已成功采到所有事件。 类别展开与权限受目标系统影响；配置通过解析不证明设备已成功采到所有事件。 </desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="385" fill="white"/>
<path d="M 49 70 Q 210.0 70.5 371 70 Q 375 70 375 74 L 375 311 Q 375 315 371 315 Q 210.0 315.5 49 315 Q 45 315 45 311 L 45 74 Q 45 70 49 70" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="210.0" dy="0">目标应用APP标记</tspan>
<tspan x="210.0" dy="28.560000000000002">atrace_apps=your.package</tspan>
<tspan x="210.0" dy="28.560000000000002">不是所有SystemUI私有段</tspan>
<tspan x="210.0" dy="28.560000000000002">按构建追加进程与tag</tspan>
</text>
<path d="M 439 70 Q 600.0 69.5 761 70 Q 765 70 765 74 L 765 311 Q 765 315 761 315 Q 600.0 315.3 439 315 Q 435 315 435 311 L 435 74 Q 435 70 439 70" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="600.0" dy="0">Binder与系统类别</tspan>
<tspan x="600.0" dy="28.560000000000002">am / binder_driver</tspan>
<tspan x="600.0" dy="28.560000000000002">gfx / view / wm</tspan>
<tspan x="600.0" dy="28.560000000000002">需确认目标系统支持</tspan>
</text>
<path d="M 829 70 Q 990.0 70.1 1151 70 Q 1155 70 1155 74 L 1155 311 Q 1155 315 1151 315 Q 990.0 314.5 829 315 Q 825 315 825 311 L 825 74 Q 825 70 829 70" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="990.0" y="156.8" text-anchor="middle" style="font-size:21px">
<tspan x="990.0" dy="0">调度事件</tspan>
<tspan x="990.0" dy="28.560000000000002">sched_switch</tspan>
<tspan x="990.0" dy="28.560000000000002">sched_wakeup / waking</tspan>
<tspan x="990.0" dy="28.560000000000002">用于线程状态与调度分析</tspan>
</text>
</svg>
