<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">拖动与 fling 的驱动入口</title>
<desc id="desc">区分输入驱动和抬手后的动画驱动，再接公共渲染下游。 两阶段的优先证据入口不同；抬手后没有持续MOVE流并不表示缺采输入。 拖动触发UI更新；fling动画驱动UI更新；沿该帧继续查看图形链路</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="930" fill="white"/>
<path d="M 315 195 L 315 385" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 375 L 315 385 L 321 375" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 195 L 885 385" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 375 L 885 385 L 891 375" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 525 L 600 715" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 705 L 600 715 L 606 705" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 45 Q 315.0 44.4 556 45 Q 560 45 560 49 L 560 191 Q 560 195 556 195 Q 315.0 195.0 74 195 Q 70 195 70 191 L 70 49 Q 70 45 74 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">按住拖动</tspan>
<tspan x="315.0" dy="34.0">MotionEvent → 输入消费 → 位置更新</tspan>
</text>
<path d="M 644 45 Q 885.0 44.8 1126 45 Q 1130 45 1130 49 L 1130 191 Q 1130 195 1126 195 Q 885.0 195.5 644 195 Q 640 195 640 191 L 640 49 Q 640 45 644 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="885.0" y="111.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">抬手 fling</tspan>
<tspan x="885.0" dy="34.0">动画回调 → 滚动计算 → 位置更新</tspan>
</text>
<path d="M 154 385 Q 600.0 385.4 1046 385 Q 1050 385 1050 389 L 1050 521 Q 1050 525 1046 525 Q 600.0 525.8 154 525 Q 150 525 150 521 L 150 389 Q 150 385 154 385" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="446.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">列表当前帧的 UI 工作</tspan>
<tspan x="600.0" dy="34.0">bind / create / prefetch / measure / layout / draw</tspan>
</text>
<path d="M 154 715 Q 600.0 714.5 1046 715 Q 1050 715 1050 719 L 1050 851 Q 1050 855 1046 855 Q 600.0 855.7 154 855 Q 150 855 150 851 L 150 719 Q 150 715 154 715" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="776.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">公共下游依赖</tspan>
<tspan x="600.0" dy="34.0">RenderThread / GPU / buffer / SF-HWC / present</tspan>
</text>
</svg>
