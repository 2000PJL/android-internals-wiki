<text x="600.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">应用发布 / 更新 Notification</tspan>
<tspan x="600.0" dy="34.0">通知数据、图片或 RemoteViews</tspan>
</text>
<path d="M 154 350 Q 600.0 350.5 1046 350 Q 1050 350 1050 354 L 1050 481 Q 1050 485 1046 485 Q 600.0 484.8 154 485 Q 150 485 150 481 L 150 354 Q 150 350 154 350" fill="white" stroke="#4A90D9" stroke-width="3"/>
