<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">动态 Tab 的身份与恢复链路</title>
<desc id="desc">动态 Tab 的身份与恢复链路：稳定 ID 与 containsItem 要共同实现，避免位置变化导致页面状态错配；通知范围仍要与实际数据变化一致。 同业务key仍须满足唯一性；不保证稳定ID后永不重建。 前一阶段为下一阶段提供输入；前一阶段为下一阶段提供输入</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="460" fill="white"/>
<path d="M 375 185 L 435 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 425 179 L 435 185 L 425 191" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 765 185 L 825 185" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 815 179 L 825 185 L 815 191" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 49 90 Q 210.0 90.6 371 90 Q 375 90 375 94 L 375 276 Q 375 280 371 280 Q 210.0 280.5 49 280 Q 45 280 45 276 L 45 94 Q 45 90 49 90" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="210.0" y="159.5" text-anchor="middle" style="font-size:25px">
<tspan x="210.0" dy="0">动态页面增删 / 重排</tspan>
<tspan x="210.0" dy="34.0">业务页面保持稳定 key</tspan>
<tspan x="210.0" dy="34.0">不以 position 当身份</tspan>
</text>
<path d="M 439 90 Q 600.0 89.3 761 90 Q 765 90 765 94 L 765 276 Q 765 280 761 280 Q 600.0 280.3 439 280 Q 435 280 435 276 L 435 94 Q 435 90 439 90" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="159.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">Adapter 身份合同</tspan>
<tspan x="600.0" dy="34.0">getItemId + containsItem</tspan>
<tspan x="600.0" dy="34.0">反映当前数据集合</tspan>
</text>
<path d="M 829 90 Q 990.0 90.5 1151 90 Q 1155 90 1155 94 L 1155 276 Q 1155 280 1151 280 Q 990.0 279.3 829 280 Q 825 280 825 276 L 825 94 Q 825 90 829 90" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="990.0" y="159.5" text-anchor="middle" style="font-size:25px">
<tspan x="990.0" dy="0">按差分通知更新</tspan>
<tspan x="990.0" dy="34.0">复查 Fragment 恢复</tspan>
<tspan x="990.0" dy="34.0">与页面创建次数</tspan>
</text>
</svg>
