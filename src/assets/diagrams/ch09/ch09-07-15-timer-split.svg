<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc">
<title id="title">Service timer 的 split 通知链</title>
<desc id="desc">Service timer 的 split 通知链：对应计时50%的计划不保证App在50%执行；取消、对象失效和降级实现均可令warning缺席。 对应计时50%的计划不保证App在50%执行；取消、对象失效和降级实现均可令warning缺席。 条件满足后进入阶段2；条件满足后进入阶段3；条件满足后进入阶段4</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="635" fill="white"/>
<path d="M 600 145 L 600 200" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 190 L 600 200 L 606 190" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 300 L 600 355" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 345 L 600 355 L 606 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 455 L 600 510" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 500 L 600 510 L 606 500" stroke="#202020" stroke-width="2.8" fill="none"/>
