<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">App timeline 缺失时的调查路径</title>
<desc id="desc">将工具覆盖缺口和没有渲染区分开。 Perfetto文档明确提示SurfaceView覆盖边界；是否完整支持仍需按设备、生产路径与采集版本确认。 进入下一依赖阶段；进入下一依赖阶段</desc>
