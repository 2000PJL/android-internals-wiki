<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">组合 flags 后按操作判断去向</title>
<desc id="desc">说明PASSTHROUGH与DIRECT_IO组合对read/write和mmap不同。 描述内核支持的组合，不声称r1 MediaProvider常规handle一定会生成该组合；其他mmap权限与可用性条件仍适用。 普通passthrough数据读写；passthrough映射；DIRECT_IO优先的数据分派；mmap使用backing</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="910" fill="white"/>
<path d="M 315 155 L 315 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 240 L 315 250 L 321 240" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 155 L 885 250" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 240 L 885 250 L 891 240" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 315 600 L 315 725" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 715 L 315 725 L 321 715" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 600 L 885 725" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 715 L 885 725 L 891 715" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 154 45 Q 600.0 44.4 1046 45 Q 1050 45 1050 49 L 1050 151 Q 1050 155 1046 155 Q 600.0 155.8 154 155 Q 150 155 150 151 L 150 49 Q 150 45 154 45" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="91.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">PASSTHROUGH</tspan>
<tspan x="600.0" dy="34.0">不带 DIRECT_IO</tspan>
</text>
<path d="M 74 250 Q 315.0 250.2 556 250 Q 560 250 560 254 L 560 356 Q 560 360 556 360 Q 315.0 360.4 74 360 Q 70 360 70 356 L 70 254 Q 70 250 74 250" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="315.0" y="296.5" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">read / write</tspan>
<tspan x="315.0" dy="34.0">内核 backing file</tspan>
</text>
<path d="M 644 250 Q 885.0 250.6 1126 250 Q 1130 250 1130 254 L 1130 356 Q 1130 360 1126 360 Q 885.0 360.3 644 360 Q 640 360 640 356 L 640 254 Q 640 250 644 250" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="885.0" y="296.5" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">mmap</tspan>
<tspan x="885.0" dy="34.0">backing file</tspan>
</text>
<path d="M 154 500 Q 600.0 500.3 1046 500 Q 1050 500 1050 504 L 1050 596 Q 1050 600 1046 600 Q 600.0 600.1 154 600 Q 150 600 150 596 L 150 504 Q 150 500 154 500" fill="white" stroke="#E8913A" stroke-width="3"/>
<text x="600.0" y="558.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">PASSTHROUGH + DIRECT_IO</tspan>
</text>
<path d="M 74 725 Q 315.0 724.7 556 725 Q 560 725 560 729 L 560 836 Q 560 840 556 840 Q 315.0 839.8 74 840 Q 70 840 70 836 L 70 729 Q 70 725 74 725" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="315.0" y="774.0" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">read / write</tspan>
<tspan x="315.0" dy="34.0">FUSE server 路径</tspan>
</text>
<path d="M 644 725 Q 885.0 725.3 1126 725 Q 1130 725 1130 729 L 1130 836 Q 1130 840 1126 840 Q 885.0 839.8 644 840 Q 640 840 640 836 L 640 729 Q 640 725 644 725" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="885.0" y="774.0" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">mmap</tspan>
<tspan x="885.0" dy="34.0">仍用 backing file</tspan>
</text>
</svg>
