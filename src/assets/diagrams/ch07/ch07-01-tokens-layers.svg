<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">SurfaceFrame 与 DisplayFrame 的关联</title>
<desc id="desc">用token和layer身份解释多图层合成关系。 不把surface token当成跨layer唯一主键，也不把surface和display token直接等值联结。 layerA参与显示帧；layerB参与显示帧；显示侧token定位合成帧</desc>
<style>@font-face{font-family:GrackerWenKai;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:GrackerWenKai;fill:#202020;font-size:25px}path,rect{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="850" fill="white"/>
<path d="M 315 180 L 315 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 309 335 L 315 345 L 321 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 885 180 L 885 345" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 879 335 L 885 345 L 891 335" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 600 475 L 600 635" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 594 625 L 600 635 L 606 625" stroke="#202020" stroke-width="2.8" fill="none"/>
<path d="M 74 45 Q 315.0 44.4 556 45 Q 560 45 560 49 L 560 176 Q 560 180 556 180 Q 315.0 180.0 74 180 Q 70 180 70 176 L 70 49 Q 70 45 74 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="315.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="315.0" dy="0">SurfaceFrame A</tspan>
<tspan x="315.0" dy="34.0">surface token + layer A + PID</tspan>
</text>
<path d="M 644 45 Q 885.0 44.5 1126 45 Q 1130 45 1130 49 L 1130 176 Q 1130 180 1126 180 Q 885.0 179.2 644 180 Q 640 180 640 176 L 640 49 Q 640 45 644 45" fill="white" stroke="#5BA4CF" stroke-width="3"/>
<text x="885.0" y="104.0" text-anchor="middle" style="font-size:25px">
<tspan x="885.0" dy="0">SurfaceFrame B</tspan>
<tspan x="885.0" dy="34.0">surface token + layer B + PID</tspan>
</text>
<path d="M 154 345 Q 600.0 344.4 1046 345 Q 1050 345 1050 349 L 1050 471 Q 1050 475 1046 475 Q 600.0 475.3 154 475 Q 150 475 150 471 L 150 349 Q 150 345 154 345" fill="white" stroke="#4A90D9" stroke-width="3"/>
<text x="600.0" y="401.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">各 SurfaceFrame 关联到 display frame token</tspan>
<tspan x="600.0" dy="34.0">通过 flow / 对应字段建立关系</tspan>
</text>
<path d="M 154 635 Q 600.0 634.9 1046 635 Q 1050 635 1050 639 L 1050 761 Q 1050 765 1046 765 Q 600.0 764.3 154 765 Q 150 765 150 761 L 150 639 Q 150 635 154 635" fill="white" stroke="#4CAF50" stroke-width="3"/>
<text x="600.0" y="691.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">DisplayFrame D</tspan>
<tspan x="600.0" dy="34.0">一次显示合成，可覆盖多个 layer</tspan>
</text>
</svg>
