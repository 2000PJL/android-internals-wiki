<text x="600.0" y="96.5" text-anchor="middle" style="font-size:25px">
<tspan x="600.0" dy="0">读取 JankType 位组合</tspan>
<tspan x="600.0" dy="34.0">同时核对 finish / present / prediction</tspan>
</text>
<path d="M 74 330 Q 315.0 330.5 556 330 Q 560 330 560 334 L 560 456 Q 560 460 556 460 Q 315.0 460.5 74 460 Q 70 460 70 456 L 70 334 Q 70 330 74 330" fill="white" stroke="#5BA4CF" stroke-width="3"/>
